# yaml-language-server: $schema=../namespace.schema.json
crypto_pwhash:
  title: Password hashing
  doc: |
    Password hashing and password-based key derivation with Argon2, a
    memory-hard function designed to make brute-force attacks expensive.

    `str/3` produces a self-describing ASCII string (algorithm, parameters,
    random salt, and hash) to store and later check with `str_verify/2`;
    `crypto_pwhash/6` derives a key of a chosen length from a password and a
    `saltbytes/0` byte salt. The default algorithm is Argon2id
    (`alg_default/0`); store every parameter alongside derived keys, since the
    defaults may change in future versions.

    `Opslimit` (CPU cost) and `Memlimit` (memory in bytes) should be as high as
    your latency budget allows: `opslimit_interactive/0` and
    `memlimit_interactive/0` suit online logins, `_moderate` and `_sensitive`
    are slower and stronger. All hashing runs on a dirty CPU scheduler.
  example: |
    Ops = libsodium_crypto_pwhash:opslimit_interactive(),
    Mem = libsodium_crypto_pwhash:memlimit_interactive(),
    Str = libsodium_crypto_pwhash:str(<<"correct horse">>, Ops, Mem),
    0 = libsodium_crypto_pwhash:str_verify(Str, <<"correct horse">>),
    -1 = libsodium_crypto_pwhash:str_verify(Str, <<"wrong horse">>),
    Salt = libsodium_randombytes:buf(libsodium_crypto_pwhash:saltbytes()),
    Key = libsodium_crypto_pwhash:crypto_pwhash(32, <<"correct horse">>, Salt, Ops, Mem,
                                                libsodium_crypto_pwhash:alg_default()),
    32 = byte_size(Key).
  constants:
    - name: alg_argon2i13
      type: int
      value: 1
      doc: Return the algorithm identifier for Argon2i version 1.3 (`crypto_pwhash_ALG_ARGON2I13`).
    - name: alg_argon2id13
      type: int
      value: 2
      doc: Return the algorithm identifier for Argon2id version 1.3 (`crypto_pwhash_ALG_ARGON2ID13`).
    - name: alg_default
      type: int
      value: 2
      doc: Return the identifier of the recommended algorithm (currently Argon2id 1.3).
    - name: bytes_min
      value: 16
    - name: bytes_max
      value: 4294967295
    - name: passwd_min
      value: 0
    - name: passwd_max
      value: 4294967295
    - name: saltbytes
      value: 16
    - name: strbytes
      value: 128
    - name: strprefix
      type: string
      value: "$argon2id$"
    - name: opslimit_min
      value: 1
    - name: opslimit_max
      value: 4294967295
    - name: memlimit_min
      value: 8192
    - name: memlimit_max
    - name: opslimit_interactive
      value: 2
    - name: memlimit_interactive
      value: 67108864
    - name: opslimit_moderate
      value: 3
    - name: memlimit_moderate
      value: 268435456
    - name: opslimit_sensitive
      value: 4
    - name: memlimit_sensitive
      value: 1073741824
    - name: primitive
      type: string
      value: "argon2id,argon2i"
      doc: Return the names of the supported primitives as a binary, such as `<<"argon2id,argon2i">>`.
  functions:
    - name: crypto_pwhash
      c: crypto_pwhash
      doc: |
        Derive an `Outlen` byte key from `Passwd` and the salt `Salt` (at least
        `saltbytes/0` bytes; only the first `saltbytes/0` are used) with the
        cost parameters `Opslimit` and `Memlimit` and the algorithm `Alg`
        (`alg_argon2i13/0`, `alg_argon2id13/0` or `alg_default/0`).

        Returns `-1` when libsodium rejects the parameters (for example an
        `Outlen` below `bytes_min/0`, limits out of range, or an unknown `Alg`)
        or cannot allocate the requested memory.
      args:
        - {type: uint, name: outlen, c_type: "unsigned long long"}
        - {type: binary, name: passwd, work: false}
        - {type: binary, name: salt, len_type: size_t, min: crypto_pwhash_SALTBYTES, work: false}
        - {type: uint, name: opslimit, c_type: "unsigned long long"}
        - {type: uint, name: memlimit, c_type: size_t}
        - {type: int, name: alg}
      prelude: |
        if (outlen > crypto_pwhash_BYTES_MAX) {
            result = enif_make_int(env, -1);
            goto cleanup;
        }
      outputs:
        - {name: out, size: outlen}
      call: crypto_pwhash(out, outlen, (const char *)passwd, passwdlen, salt, opslimit, memlimit, alg)
      schedule: dirty_cpu
      returns: out
    - name: str
      doc: |
        Hash `Passwd` for storage using the default algorithm with the cost
        parameters `Opslimit` and `Memlimit` and a random salt.

        Returns an ASCII binary of at most `strbytes/0` - 1 bytes starting with
        `strprefix/0`, or `-1` on failure.
      args:
        - {type: binary, name: passwd, work: false}
        - {type: uint, name: opslimit, c_type: "unsigned long long"}
        - {type: uint, name: memlimit, c_type: size_t}
      outputs:
        - {name: out, size: crypto_pwhash_STRBYTES, length: "strlen((const char *)out)"}
      call: crypto_pwhash_str((char *)out, (const char *)passwd, passwdlen, opslimit, memlimit)
      schedule: dirty_cpu
      returns: out
    - name: str_alg
      doc: |
        Like `str/3`, but hash `Passwd` with the algorithm `Alg`
        (`alg_argon2i13/0` or `alg_argon2id13/0`). Returns `-1` on failure.
      args:
        - {type: binary, name: passwd, work: false}
        - {type: uint, name: opslimit, c_type: "unsigned long long"}
        - {type: uint, name: memlimit, c_type: size_t}
        - {type: int, name: alg}
      outputs:
        - {name: out, size: crypto_pwhash_STRBYTES, length: "strlen((const char *)out)"}
      call: crypto_pwhash_str_alg((char *)out, (const char *)passwd, passwdlen, opslimit, memlimit, alg)
      schedule: dirty_cpu
      returns: out
    - name: str_verify
      doc: |
        Check `Passwd` against `Str`, a string produced by `str/3` or
        `str_alg/4` (Argon2i and Argon2id strings are both accepted).

        Returns `0` when the password matches and `-1` when it does not or
        `Str` is malformed.
      args:
        - {type: cstring, name: str, max: crypto_pwhash_STRBYTES}
        - {type: binary, name: passwd, work: false}
      call: crypto_pwhash_str_verify(str, (const char *)passwd, passwdlen)
      check: none
      schedule: dirty_cpu
      returns: "int:rc"
      spec: "0 | -1"
    - name: str_needs_rehash
      doc: |
        Check whether `Str` (an Argon2i or Argon2id string) was hashed with
        exactly the cost parameters `Opslimit` and `Memlimit`.

        Returns `0` when it was, `1` when the password should be rehashed (after
        a successful `str_verify/2`), and `-1` when `Str` is malformed or the
        parameters are invalid.
      args:
        - {type: cstring, name: str, max: crypto_pwhash_STRBYTES}
        - {type: uint, name: opslimit, c_type: "unsigned long long"}
        - {type: uint, name: memlimit, c_type: size_t}
      call: crypto_pwhash_str_needs_rehash(str, opslimit, memlimit)
      check: none
      returns: "int:rc"
      spec: "-1 | 0 | 1"
  tests:
    - name: known_answers
      code: |
        Passwd = binary:decode_hex(<<"4a857e2ee8aa9b6056f2424e84d24a72473378906ee04a46cb05311502d5250b82ad86b83c8f20a23dbb74f6da60b0b6ecffd67134d45946ac8ebfb3064294bc097d43ced68642bfb8bbbdd0f50b30118f5e">>),
        Salt = binary:decode_hex(<<"39d82eef32010b8b79cc5ba88ed539fbaba741100f2edbeca7cc171ffeabf258">>),
        Argon2i = binary:decode_hex(<<"">>),
        Argon2id = binary:decode_hex(<<"">>),
        Argon2i = libsodium_crypto_pwhash:crypto_pwhash(190, Passwd, Salt, 3, 1432947, libsodium_crypto_pwhash:alg_argon2i13()),
        Argon2id = libsodium_crypto_pwhash:crypto_pwhash(190, Passwd, Salt, 3, 1432947, libsodium_crypto_pwhash:alg_argon2id13()),
        0 = libsodium_crypto_pwhash:str_verify(<<"$argon2i$v=19$m=4096,t=1,p=1$X1NhbHQAAAAAAAAAAAAAAA$bWh++MKN1OiFHKgIWTLvIi1iHicmHH7+Fv3K88ifFfI">>, <<>>),
        0 = libsodium_crypto_pwhash:str_verify(<<"$argon2id$v=19$m=4882,t=2,p=1$bA81arsiXysd3WbTRzmEOw$Nm8QBM+7RH1DXo9rvp5cwKEOOOfD2g6JuxlXihoNcpE">>, <<>>).
    - name: str_round_trip
      code: |
        Ops = libsodium_crypto_pwhash:opslimit_min(),
        Mem = libsodium_crypto_pwhash:memlimit_min(),
        Str = libsodium_crypto_pwhash:str(<<"Correct Horse Battery Staple">>, Ops, Mem),
        Prefix = libsodium_crypto_pwhash:strprefix(),
        <<Prefix:10/binary, _/binary>> = Str,
        0 = libsodium_crypto_pwhash:str_verify(Str, <<"Correct Horse Battery Staple">>),
        -1 = libsodium_crypto_pwhash:str_verify(Str, <<"Wrong Horse Battery Staple">>),
        0 = libsodium_crypto_pwhash:str_needs_rehash(Str, Ops, Mem),
        1 = libsodium_crypto_pwhash:str_needs_rehash(Str, Ops + 1, Mem),
        Str2 = libsodium_crypto_pwhash:str_alg(<<"pw">>, 3, Mem, libsodium_crypto_pwhash:alg_argon2i13()),
        <<"$argon2i$", _/binary>> = Str2,
        0 = libsodium_crypto_pwhash:str_verify(Str2, <<"pw">>),
        0 = libsodium_crypto_pwhash:str_needs_rehash(Str2, 3, Mem),
        1 = libsodium_crypto_pwhash:str_needs_rehash(Str2, 3, Mem * 2).
    - name: legacy_failures
      code: |
        Salt = binary:copy(<<0>>, 16),
        -1 = libsodium_crypto_pwhash:crypto_pwhash(32, <<"pw">>, Salt, 3, 1 bsl 12, 0),
        -1 = libsodium_crypto_pwhash:crypto_pwhash(32, <<"pw">>, Salt, 3, 1, libsodium_crypto_pwhash:alg_default()),
        -1 = libsodium_crypto_pwhash:crypto_pwhash(5, <<"pw">>, Salt, 3, 1 bsl 12, libsodium_crypto_pwhash:alg_default()),
        -1 = libsodium_crypto_pwhash:crypto_pwhash(1 bsl 33, <<"pw">>, Salt, 3, 1 bsl 12, libsodium_crypto_pwhash:alg_default()),
        -1 = libsodium_crypto_pwhash:str(<<"pw">>, 0, 1 bsl 12),
        -1 = libsodium_crypto_pwhash:str_verify(<<"$argon2id$v=19$m=4096,t=0,p=1$X1NhbHQAAAAAAAAAAAAAAA$bWh++MKN1OiFHKgIWTLvIi1iHicmHH7+Fv3K88ifFfI">>, <<>>),
        -1 = libsodium_crypto_pwhash:str_verify(<<>>, <<"pw">>),
        -1 = libsodium_crypto_pwhash:str_needs_rehash(<<"$argon2id$garbage">>, 3, 1 bsl 12).
    - name: badarg
      code: |
        ok = try libsodium_crypto_pwhash:crypto_pwhash(32, <<"pw">>, <<0:120>>, 3, 1 bsl 12, 2) of _ -> unexpected catch error:badarg -> ok end,
        ok = try libsodium_crypto_pwhash:crypto_pwhash(-1, <<"pw">>, <<0:128>>, 3, 1 bsl 12, 2) of _ -> unexpected catch error:badarg -> ok end,
        ok = try libsodium_crypto_pwhash:str(pw, 3, 1 bsl 12) of _ -> unexpected catch error:badarg -> ok end,
        ok = try libsodium_crypto_pwhash:str_verify(binary:copy(<<"a">>, 129), <<"pw">>) of _ -> unexpected catch error:badarg -> ok end,
        ok = try libsodium_crypto_pwhash:str_verify(<<"$argon2id$", 0>>, <<"pw">>) of _ -> unexpected catch error:badarg -> ok end.
