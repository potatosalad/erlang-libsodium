# yaml-language-server: $schema=../namespace.schema.json
crypto_core_ed25519:
  title: Edwards25519 arithmetic
  doc: |
    Low-level arithmetic on the edwards25519 curve and on scalars modulo its
    prime group order L, for building custom protocols.

    Points are `bytes/0` byte compressed encodings and scalars are
    `scalarbytes/0` byte little-endian integers. `is_valid_point/1` accepts
    only canonical encodings of points on the main subgroup; `add/2` and
    `sub/2` only reject encodings that are not on the curve, so check
    untrusted input first. Scalars are used as given: there is no clamping,
    unlike `m:libsodium_crypto_scalarmult_ed25519`.

    `scalar_reduce/1` reduces a `nonreducedscalarbytes/0` byte value modulo
    L, and `from_uniform/1` maps `uniformbytes/0` bytes (such as a hash) to a
    point. Prefer `m:libsodium_crypto_core_ristretto255` for new protocols, as
    it avoids the cofactor pitfalls of edwards25519.
  example: |
    P = libsodium_crypto_core_ed25519:random(),
    Q = libsodium_crypto_core_ed25519:random(),
    1 = libsodium_crypto_core_ed25519:is_valid_point(P),
    R = libsodium_crypto_core_ed25519:add(P, Q),
    P = libsodium_crypto_core_ed25519:sub(R, Q),
    S = libsodium_crypto_core_ed25519:scalar_random(),
    One = libsodium_crypto_core_ed25519:scalar_mul(S, libsodium_crypto_core_ed25519:scalar_invert(S)),
    One = <<1, 0:248>>.
  constants:
    - name: bytes
      value: 32
    - name: uniformbytes
      value: 32
    - name: hashbytes
      value: 64
    - name: scalarbytes
      value: 32
    - name: nonreducedscalarbytes
      value: 64
  functions:
    - name: is_valid_point
      doc: |
        Return `1` when `P` is the canonical encoding of a point on the main
        subgroup (excluding small-order points), otherwise `0`.
      args:
        - {type: fixed, name: p, size: crypto_core_ed25519_BYTES}
      check: none
      returns: "int:rc"
      spec: "0 | 1"
      erlang:
        - params: [P]
    - name: add
      doc: Return the point `P + Q`, or `-1` when either input is not a point on the curve.
      args:
        - {type: fixed, name: p, size: crypto_core_ed25519_BYTES}
        - {type: fixed, name: q, size: crypto_core_ed25519_BYTES}
      outputs:
        - {name: r, size: crypto_core_ed25519_BYTES}
      returns: r
      erlang:
        - params: [P, Q]
    - name: sub
      doc: Return the point `P - Q`, or `-1` when either input is not a point on the curve.
      args:
        - {type: fixed, name: p, size: crypto_core_ed25519_BYTES}
        - {type: fixed, name: q, size: crypto_core_ed25519_BYTES}
      outputs:
        - {name: r, size: crypto_core_ed25519_BYTES}
      returns: r
      erlang:
        - params: [P, Q]
    - name: from_uniform
      doc: |
        Map the `uniformbytes/0` byte string `R` (such as the output of a hash
        function) to a point on the main subgroup using Elligator 2.
      args:
        - {type: fixed, name: r, size: crypto_core_ed25519_UNIFORMBYTES}
      outputs:
        - {name: p, size: crypto_core_ed25519_BYTES}
      returns: p
      erlang:
        - params: [R]
    - name: from_hash
      doc: |
        Map the `hashbytes/0` byte string `H` to a point. Deprecated and
        undocumented by libsodium; use `from_uniform/1` instead.
      deprecated: Undocumented and deprecated by libsodium; use from_uniform/1.
      args:
        - {type: fixed, name: h, size: crypto_core_ed25519_HASHBYTES}
      outputs:
        - {name: p, size: crypto_core_ed25519_BYTES}
      returns: p
      erlang:
        - params: [H]
    - name: random
      doc: Return a random point on the main subgroup.
      outputs:
        - {name: p, size: crypto_core_ed25519_BYTES}
      rc_type: void
      check: none
      returns: p
    - name: scalar_random
      doc: Return a random scalar in `[0, L)`.
      outputs:
        - {name: r, size: crypto_core_ed25519_SCALARBYTES}
      rc_type: void
      check: none
      returns: r
    - name: scalar_invert
      doc: Return the multiplicative inverse of the scalar `S` modulo L, or `-1` when `S` is zero.
      args:
        - {type: fixed, name: s, size: crypto_core_ed25519_SCALARBYTES}
      outputs:
        - {name: recip, size: crypto_core_ed25519_SCALARBYTES}
      returns: recip
      erlang:
        - params: [S]
    - name: scalar_negate
      doc: Return `-S mod L`.
      args:
        - {type: fixed, name: s, size: crypto_core_ed25519_SCALARBYTES}
      outputs:
        - {name: neg, size: crypto_core_ed25519_SCALARBYTES}
      rc_type: void
      check: none
      returns: neg
      erlang:
        - params: [S]
    - name: scalar_complement
      doc: Return `1 - S mod L`, so that `S + Comp = 1 (mod L)`.
      args:
        - {type: fixed, name: s, size: crypto_core_ed25519_SCALARBYTES}
      outputs:
        - {name: comp, size: crypto_core_ed25519_SCALARBYTES}
      rc_type: void
      check: none
      returns: comp
      erlang:
        - params: [S]
    - name: scalar_add
      doc: Return `X + Y mod L`.
      args:
        - {type: fixed, name: x, size: crypto_core_ed25519_SCALARBYTES}
        - {type: fixed, name: y, size: crypto_core_ed25519_SCALARBYTES}
      outputs:
        - {name: z, size: crypto_core_ed25519_SCALARBYTES}
      rc_type: void
      check: none
      returns: z
    - name: scalar_sub
      doc: Return `X - Y mod L`.
      args:
        - {type: fixed, name: x, size: crypto_core_ed25519_SCALARBYTES}
        - {type: fixed, name: y, size: crypto_core_ed25519_SCALARBYTES}
      outputs:
        - {name: z, size: crypto_core_ed25519_SCALARBYTES}
      rc_type: void
      check: none
      returns: z
    - name: scalar_mul
      doc: Return `X * Y mod L`.
      args:
        - {type: fixed, name: x, size: crypto_core_ed25519_SCALARBYTES}
        - {type: fixed, name: y, size: crypto_core_ed25519_SCALARBYTES}
      outputs:
        - {name: z, size: crypto_core_ed25519_SCALARBYTES}
      rc_type: void
      check: none
      returns: z
    - name: scalar_reduce
      doc: |
        Reduce the `nonreducedscalarbytes/0` byte little-endian integer `S`
        modulo L. `S` should be sampled from at least 317 bits (such as a
        64-byte hash) for the result to be close to uniform.
      args:
        - {type: fixed, name: s, size: crypto_core_ed25519_NONREDUCEDSCALARBYTES, erlang_type: nonreduced_scalar}
      outputs:
        - {name: r, size: crypto_core_ed25519_SCALARBYTES}
      rc_type: void
      check: none
      returns: r
      erlang:
        - params: [S]
  tests:
    - name: points
      code: |
        B = binary:decode_hex(<<"5866666666666666666666666666666666666666666666666666666666666666">>),
        B2 = binary:decode_hex(<<"c9a3f86aae465f0e56513864510f3997561fa2c9e85ea21dc2292309f3cd6022">>),
        1 = libsodium_crypto_core_ed25519:is_valid_point(B),
        B2 = libsodium_crypto_core_ed25519:add(B, B),
        B = libsodium_crypto_core_ed25519:sub(B2, B),
        Identity = <<1, 0:248>>,
        0 = libsodium_crypto_core_ed25519:is_valid_point(Identity),
        0 = libsodium_crypto_core_ed25519:is_valid_point(<<0:256>>),
        Identity = libsodium_crypto_core_ed25519:sub(B, B),
        P1 = libsodium_crypto_core_ed25519:from_uniform(libsodium_randombytes:buf(32)),
        1 = libsodium_crypto_core_ed25519:is_valid_point(P1),
        P2 = libsodium_crypto_core_ed25519:from_hash(libsodium_randombytes:buf(64)),
        1 = libsodium_crypto_core_ed25519:is_valid_point(P2).
    - name: scalars
      code: |
        X = libsodium_crypto_core_ed25519:scalar_random(),
        Y = libsodium_crypto_core_ed25519:scalar_random(),
        Zero = <<0:256>>,
        One = <<1, 0:248>>,
        Zero = libsodium_crypto_core_ed25519:scalar_add(X, libsodium_crypto_core_ed25519:scalar_negate(X)),
        One = libsodium_crypto_core_ed25519:scalar_add(X, libsodium_crypto_core_ed25519:scalar_complement(X)),
        X = libsodium_crypto_core_ed25519:scalar_sub(libsodium_crypto_core_ed25519:scalar_add(X, Y), Y),
        X = libsodium_crypto_core_ed25519:scalar_reduce(<<X/binary, 0:256>>),
        Y = libsodium_crypto_core_ed25519:scalar_mul(Y, One),
        -1 = libsodium_crypto_core_ed25519:scalar_invert(Zero).
    - name: invalid_points
      code: |
        B = binary:decode_hex(<<"5866666666666666666666666666666666666666666666666666666666666666">>),
        NotOnCurve = <<2, 0:248>>,
        0 = libsodium_crypto_core_ed25519:is_valid_point(NotOnCurve),
        -1 = libsodium_crypto_core_ed25519:add(B, NotOnCurve),
        -1 = libsodium_crypto_core_ed25519:sub(NotOnCurve, B),
        badarg = try libsodium_crypto_core_ed25519:add(B, <<1, 2, 3>>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_core_ed25519:scalar_reduce(B) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_core_ed25519:is_valid_point(<<B/binary, 0>>) catch error:badarg -> badarg end.
