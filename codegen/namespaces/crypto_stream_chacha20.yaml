# yaml-language-server: $schema=../namespace.schema.json
crypto_stream_chacha20:
  title: ChaCha20 stream cipher
  doc: |
    The ChaCha20 stream cipher, in both its original form (64-bit nonce and
    64-bit block counter) and the IETF variant from RFC 8439 (`ietf_*`
    functions: 96-bit nonce and 32-bit block counter, limiting a single
    message to 256 GiB).

    `crypto_stream_chacha20/3` and `ietf/3` return raw keystream; `'xor'/3`
    and `ietf_xor/3` encrypt or decrypt by combining a message with it, and the
    `_ic` variants start at a given 64-byte block counter.

    This is not authenticated encryption: ciphertexts can be modified without
    detection, so pair it with a MAC or use `m:libsodium_crypto_aead_chacha20poly1305`
    instead. A nonce must never be reused with the same key; the short nonces
    here are too small to choose at random safely for many messages, which
    `m:libsodium_crypto_stream_xchacha20` avoids.
  example: |
    K = libsodium_crypto_stream_chacha20:keygen(),
    N = libsodium_randombytes:buf(libsodium_crypto_stream_chacha20:noncebytes()),
    C = libsodium_crypto_stream_chacha20:'xor'(<<"message">>, N, K),
    <<"message">> = libsodium_crypto_stream_chacha20:'xor'(C, N, K).
  constants:
    - name: keybytes
      value: 32
    - name: noncebytes
      value: 8
    - name: messagebytes_max
    - name: ietf_keybytes
      value: 32
    - name: ietf_noncebytes
      value: 12
    - name: ietf_messagebytes_max
  functions:
    - name: crypto_stream_chacha20
      c: crypto_stream_chacha20
      doc: Return `CLen` bytes of keystream for the `noncebytes/0` byte nonce `N` and the `keybytes/0` byte key `K`.
      args:
        - {type: uint, name: clen, c_type: size_t, work: true}
        - {type: fixed, name: n, size: crypto_stream_chacha20_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_stream_chacha20_KEYBYTES}
      outputs:
        - {name: c, size: clen}
      check: none
      returns: c
      erlang:
        - params: [CLen, N, K]
    - name: xor
      doc: |
        Encrypt or decrypt `M` by combining it with the keystream for the nonce
        `N` and key `K`, starting at block counter `0`.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_stream_chacha20_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_stream_chacha20_KEYBYTES}
      outputs:
        - {name: c, size: mlen}
      check: none
      returns: c
    - name: xor_ic
      doc: |
        Like `'xor'/3`, but start at the 64-byte block counter `IC`, so the
        message is combined with the keystream from byte `IC * 64` onwards.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_stream_chacha20_NONCEBYTES}
        - {type: uint, name: ic, c_type: uint64_t}
        - {type: fixed, name: k, size: crypto_stream_chacha20_KEYBYTES}
      outputs:
        - {name: c, size: mlen}
      check: none
      returns: c
      erlang:
        - params: [M, N, IC, K]
    - name: keygen
      doc: Generate a random `keybytes/0` byte key.
      outputs:
        - {name: k, size: crypto_stream_chacha20_KEYBYTES}
      rc_type: void
      check: none
      returns: k
    - name: ietf
      doc: |
        Return `CLen` bytes of IETF ChaCha20 keystream for the
        `ietf_noncebytes/0` byte nonce `N` and the `ietf_keybytes/0` byte key
        `K`. `CLen` must not exceed `ietf_messagebytes_max/0`.
      args:
        - {type: uint, name: clen, c_type: size_t, max: crypto_stream_chacha20_ietf_MESSAGEBYTES_MAX, work: true}
        - {type: fixed, name: n, size: crypto_stream_chacha20_ietf_NONCEBYTES, erlang_type: ietf_n}
        - {type: fixed, name: k, size: crypto_stream_chacha20_ietf_KEYBYTES}
      outputs:
        - {name: c, size: clen}
      check: none
      returns: c
      erlang:
        - params: [CLen, N, K]
    - name: ietf_xor
      doc: |
        Encrypt or decrypt `M` with IETF ChaCha20 using the nonce `N` and key
        `K`, starting at block counter `0`.
      args:
        - {type: binary, name: m, max: crypto_stream_chacha20_ietf_MESSAGEBYTES_MAX}
        - {type: fixed, name: n, size: crypto_stream_chacha20_ietf_NONCEBYTES, erlang_type: ietf_n}
        - {type: fixed, name: k, size: crypto_stream_chacha20_ietf_KEYBYTES}
      outputs:
        - {name: c, size: mlen}
      check: none
      returns: c
    - name: ietf_xor_ic
      doc: |
        Like `ietf_xor/3`, but start at the 32-bit block counter `IC`. Raises
        `badarg` when the message would overflow the block counter.
      args:
        - {type: binary, name: m, max: crypto_stream_chacha20_ietf_MESSAGEBYTES_MAX}
        - {type: fixed, name: n, size: crypto_stream_chacha20_ietf_NONCEBYTES, erlang_type: ietf_n}
        - {type: uint, name: ic, c_type: uint32_t}
        - {type: fixed, name: k, size: crypto_stream_chacha20_ietf_KEYBYTES}
      prelude: |
        if ((unsigned long long)ic > (64ULL * (1ULL << 32)) / 64ULL - (mlen + 63ULL) / 64ULL) {
            result = enif_make_badarg(env);
            goto cleanup;
        }
      outputs:
        - {name: c, size: mlen}
      check: none
      returns: c
      erlang:
        - params: [M, N, IC, K]
    - name: ietf_keygen
      doc: Generate a random `ietf_keybytes/0` byte key.
      outputs:
        - {name: k, size: crypto_stream_chacha20_ietf_KEYBYTES}
      rc_type: void
      check: none
      returns: k
  tests:
    - name: xor_round_trip
      code: |
        K = libsodium_crypto_stream_chacha20:keygen(),
        N = libsodium_randombytes:buf(8),
        M = libsodium_randombytes:buf(200),
        Stream = libsodium_crypto_stream_chacha20:crypto_stream_chacha20(264, N, K),
        C = libsodium_crypto_stream_chacha20:'xor'(M, N, K),
        C = crypto:exor(M, binary:part(Stream, 0, 200)),
        M = libsodium_crypto_stream_chacha20:'xor'(C, N, K),
        Tail = crypto:exor(M, binary:part(Stream, 64, 200)),
        Tail = libsodium_crypto_stream_chacha20:xor_ic(M, N, 1, K),
        IK = libsodium_crypto_stream_chacha20:ietf_keygen(),
        IN = libsodium_randombytes:buf(12),
        IStream = libsodium_crypto_stream_chacha20:ietf(264, IN, IK),
        IC = libsodium_crypto_stream_chacha20:ietf_xor(M, IN, IK),
        IC = crypto:exor(M, binary:part(IStream, 0, 200)),
        ITail = crypto:exor(M, binary:part(IStream, 64, 200)),
        ITail = libsodium_crypto_stream_chacha20:ietf_xor_ic(M, IN, 1, IK),
        <<>> = libsodium_crypto_stream_chacha20:'xor'(<<>>, N, K).
    - name: otp_crypto
      code: |
        K = libsodium_crypto_stream_chacha20:keygen(),
        N = libsodium_randombytes:buf(8),
        IN = libsodium_randombytes:buf(12),
        M = libsodium_randombytes:buf(300),
        C1 = crypto:crypto_one_time(chacha20, K, <<7:64/little, N/binary>>, M, true),
        C1 = libsodium_crypto_stream_chacha20:xor_ic(M, N, 7, K),
        C2 = crypto:crypto_one_time(chacha20, K, <<0:32/little, IN/binary>>, M, true),
        C2 = libsodium_crypto_stream_chacha20:ietf_xor(M, IN, K),
        C3 = crypto:crypto_one_time(chacha20, K, <<5:32/little, IN/binary>>, M, true),
        C3 = libsodium_crypto_stream_chacha20:ietf_xor_ic(M, IN, 5, K).
    - name: badarg
      code: |
        K = libsodium_crypto_stream_chacha20:keygen(),
        ok = try libsodium_crypto_stream_chacha20:'xor'(<<"m">>, <<0:96>>, K) of _ -> unexpected catch error:badarg -> ok end,
        ok = try libsodium_crypto_stream_chacha20:crypto_stream_chacha20(-1, <<0:64>>, K) of _ -> unexpected catch error:badarg -> ok end,
        ok = try libsodium_crypto_stream_chacha20:ietf_xor_ic(<<"m">>, <<0:96>>, 1 bsl 32, K) of _ -> unexpected catch error:badarg -> ok end,
        ok = try libsodium_crypto_stream_chacha20:ietf_xor_ic(binary:copy(<<0>>, 65), <<0:96>>, 16#ffffffff, K) of _ -> unexpected catch error:badarg -> ok end,
        <<_:64/binary>> = libsodium_crypto_stream_chacha20:ietf_xor_ic(binary:copy(<<0>>, 64), <<0:96>>, 16#ffffffff, K).
