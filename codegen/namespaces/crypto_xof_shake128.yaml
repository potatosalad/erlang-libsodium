# yaml-language-server: $schema=../namespace.schema.json
crypto_xof_shake128:
  title: SHAKE128 extendable-output function
  doc: |
    SHAKE128 (FIPS 202) is an extendable-output function (XOF) built on
    the Keccak-f[1600] permutation with 24 rounds. It hashes an input of
    any length into an output of any requested length and offers 128-bit
    security against collision and preimage attacks.

    The standard domain byte `domain_standard/0` (`16#1F`) produces
    SHAKE128 as specified; `init_with_domain/1` accepts another domain
    byte to derive an independent, non-standard function for domain
    separation.

    The streaming functions thread an opaque `t:state/0` through `init/0`,
    `update/2`, and `squeeze/2`. Every call returns a new state and leaves its
    argument unchanged. Squeezing continues the output stream: consecutive
    `squeeze/2` calls on the returned states produce the same bytes as one
    longer squeeze, so output can be read incrementally. Updates over large
    inputs yield to other processes between chunks.
  example: |
    Out = libsodium_crypto_xof_shake128:crypto_xof_shake128(32, <<"hello world">>),
    32 = byte_size(Out),
    State0 = libsodium_crypto_xof_shake128:init(),
    State1 = libsodium_crypto_xof_shake128:update(State0, <<"hello ">>),
    State2 = libsodium_crypto_xof_shake128:update(State1, <<"world">>),
    {State3, First} = libsodium_crypto_xof_shake128:squeeze(State2, 16),
    {_State4, Second} = libsodium_crypto_xof_shake128:squeeze(State3, 16),
    Out = <<First/binary, Second/binary>>.
  see_also: [libsodium_crypto_xof_shake256, libsodium_crypto_xof_turboshake128, libsodium_crypto_core_keccak1600]
  constants:
    - name: blockbytes
      value: 168
    - name: statebytes
      value: 256
    - name: domain_standard
      type: uint
      value: 31
  functions:
    - name: crypto_xof_shake128
      c: crypto_xof_shake128
      doc: |
        Hash `In` with SHAKE128 and the standard domain byte, returning
        `Outlen` bytes of output.
      args:
        - {type: uint, name: outlen, c_type: size_t, work: true}
        - {type: binary, name: in}
      outputs:
        - {name: out, size: outlen}
      returns: out
    - name: init
      doc: Start a streaming SHAKE128 hash with the standard domain byte `domain_standard/0`.
      outputs:
        - {type: state, name: state, c_type: crypto_xof_shake128_state}
      returns: state
    - name: init_with_domain
      doc: |
        Start a streaming SHAKE128 hash with the domain separation byte
        `Domain` (an integer from `0` to `255`).
      args:
        - {type: uint, name: domain, c_type: "unsigned char"}
      outputs:
        - {type: state, name: state, c_type: crypto_xof_shake128_state}
      returns: state
    - name: update
      doc: |
        Absorb `In` into `State` and return the updated state.

        Returns `-1` if `State` has already been squeezed; absorbing after
        squeezing is not supported.
      args:
        - {type: state, name: state, c_type: crypto_xof_shake128_state}
        - {type: binary, name: in}
      update: true
      returns: state
    - name: squeeze
      doc: |
        Read the next `Outlen` bytes of output from `State`.

        Returns `{NewState, Out}`. Squeezing `NewState` again continues the
        output stream where `Out` ended, so successive squeezes produce the
        same bytes as a single longer one. `State` itself is unchanged and
        squeezing it again repeats `Out`.
      args:
        - {type: state, name: state, c_type: crypto_xof_shake128_state}
        - {type: uint, name: outlen, c_type: size_t, work: true}
      outputs:
        - {name: out, size: outlen}
      call: crypto_xof_shake128_squeeze(&state, out, outlen)
      returns: [state, out]
  tests:
    - name: known_answer
      code: |
        Mod = libsodium_crypto_xof_shake128,
        Fox = <<"The quick brown fox jumps over the lazy dog">>,
        Long = binary:copy(<<"0123456789abcdef">>, 100),
        [begin
             Expected = crypto:hash_xof(shake128, In, Len * 8),
             Expected = Mod:crypto_xof_shake128(Len, In)
         end
         || In <- [<<>>, <<"abc">>, Fox, Long], Len <- [1, 32, 168, 169, 1000]],
        <<>> = Mod:crypto_xof_shake128(0, Fox).
    - name: squeeze_continues_stream
      code: |
        Mod = libsodium_crypto_xof_shake128,
        In = <<"squeeze me">>,
        Full = Mod:crypto_xof_shake128(1000, In),
        S0 = Mod:update(Mod:init(), In),
        {S1, A} = Mod:squeeze(S0, 100),
        {S2, B} = Mod:squeeze(S1, 336),
        {_, C} = Mod:squeeze(S2, 564),
        Full = <<A/binary, B/binary, C/binary>>,
        {_, A} = Mod:squeeze(S0, 100),
        {_, <<>>} = Mod:squeeze(S0, 0),
        true = is_reference(S1),
        -1 = Mod:update(S1, <<"more">>).
    - name: streaming_matches_one_shot
      code: |
        Mod = libsodium_crypto_xof_shake128,
        Large = binary:copy(<<"0123456789abcdef">>, 20000),
        Expected = Mod:crypto_xof_shake128(64, <<Large/binary, Large/binary>>),
        S0 = Mod:init(),
        S1 = Mod:update(S0, Large),
        S2 = Mod:update(S1, Large),
        {_, Expected} = Mod:squeeze(S2, 64),
        {_, Expected} = Mod:squeeze(Mod:update(Mod:init_with_domain(Mod:domain_standard()), <<Large/binary, Large/binary>>), 64),
        {_, Other} = Mod:squeeze(Mod:update(Mod:init_with_domain(16#01), <<Large/binary, Large/binary>>), 64),
        true = Other =/= Expected.
    - name: badarg
      code: |
        Mod = libsodium_crypto_xof_shake128,
        S0 = Mod:init(),
        badarg = try Mod:crypto_xof_shake128(-1, <<"x">>) catch error:badarg -> badarg end,
        badarg = try Mod:crypto_xof_shake128(32, not_a_binary) catch error:badarg -> badarg end,
        badarg = try Mod:init_with_domain(256) catch error:badarg -> badarg end,
        badarg = try Mod:init_with_domain(-1) catch error:badarg -> badarg end,
        badarg = try Mod:update(<<0:2048>>, <<"x">>) catch error:badarg -> badarg end,
        badarg = try Mod:update(S0, not_a_binary) catch error:badarg -> badarg end,
        badarg = try Mod:squeeze(<<0:2048>>, 32) catch error:badarg -> badarg end,
        badarg = try Mod:squeeze(S0, -1) catch error:badarg -> badarg end.
