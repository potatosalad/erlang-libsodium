# yaml-language-server: $schema=../namespace.schema.json
crypto_box_curve25519xchacha20poly1305:
  title: X25519-XChaCha20-Poly1305 box
  doc: |
    Public-key authenticated encryption with X25519, XChaCha20, and Poly1305.

    This is the same construction as `m:libsodium_crypto_box`, using
    XChaCha20 instead of XSalsa20. Keys are `publickeybytes/0` and
    `secretkeybytes/0` bytes, and nonces are `noncebytes/0` bytes. Random nonces
    are safe at this size, but a nonce must never be reused for the same pair
    of keys. Ciphertexts are `macbytes/0` bytes longer than their messages.

    `beforenm/2` precomputes the `beforenmbytes/0` byte shared key used by the
    `_afternm` variants. `seal/2` and `seal_open/3` provide anonymous
    encryption to a public key; sealed boxes are `sealbytes/0` bytes longer
    than their messages.
  example: |
    {AlicePK, AliceSK} = libsodium_crypto_box_curve25519xchacha20poly1305:keypair(),
    {BobPK, BobSK} = libsodium_crypto_box_curve25519xchacha20poly1305:keypair(),
    Nonce = libsodium_randombytes:buf(libsodium_crypto_box_curve25519xchacha20poly1305:noncebytes()),
    Ciphertext = libsodium_crypto_box_curve25519xchacha20poly1305:easy(<<"message">>, Nonce, BobPK, AliceSK),
    <<"message">> = libsodium_crypto_box_curve25519xchacha20poly1305:open_easy(Ciphertext, Nonce, AlicePK, BobSK).
  constants:
    - name: seedbytes
      value: 32
    - name: publickeybytes
      value: 32
    - name: secretkeybytes
      value: 32
    - name: beforenmbytes
      value: 32
    - name: noncebytes
      value: 24
    - name: macbytes
      value: 16
    - name: messagebytes_max
    - name: sealbytes
      value: 48
  functions:
    - name: seed_keypair
      doc: |
        Deterministically derive a key pair from the `seedbytes/0` byte `Seed`.
        Returns `{PK, SK}`.
      args:
        - {type: fixed, name: seed, size: crypto_box_curve25519xchacha20poly1305_SEEDBYTES}
      outputs:
        - {name: pk, size: crypto_box_curve25519xchacha20poly1305_PUBLICKEYBYTES}
        - {name: sk, size: crypto_box_curve25519xchacha20poly1305_SECRETKEYBYTES}
      returns: [pk, sk]
      erlang:
        - params: [Seed]
    - name: keypair
      doc: Generate a random key pair. Returns `{PK, SK}`.
      outputs:
        - {name: pk, size: crypto_box_curve25519xchacha20poly1305_PUBLICKEYBYTES}
        - {name: sk, size: crypto_box_curve25519xchacha20poly1305_SECRETKEYBYTES}
      returns: [pk, sk]
    - name: easy
      doc: |
        Encrypt and authenticate `M` with the nonce `N`, the recipient's public
        key `PK`, and the sender's secret key `SK`.

        Returns the `macbytes/0` byte authentication tag followed by the
        ciphertext, or `-1` on failure.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_box_curve25519xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: pk, size: crypto_box_curve25519xchacha20poly1305_PUBLICKEYBYTES}
        - {type: fixed, name: sk, size: crypto_box_curve25519xchacha20poly1305_SECRETKEYBYTES}
      outputs:
        - {name: c, size: "mlen + crypto_box_curve25519xchacha20poly1305_MACBYTES"}
      returns: c
      erlang:
        - params: [M, N, PK, SK]
    - name: open_easy
      doc: |
        Verify and decrypt `C`, produced by `easy/4`, with the nonce `N`, the
        sender's public key `PK`, and the recipient's secret key `SK`.

        Returns the plaintext, or `-1` when verification fails.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: n, size: crypto_box_curve25519xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: pk, size: crypto_box_curve25519xchacha20poly1305_PUBLICKEYBYTES}
        - {type: fixed, name: sk, size: crypto_box_curve25519xchacha20poly1305_SECRETKEYBYTES}
      outputs:
        - name: m
          size: "(clen < crypto_box_curve25519xchacha20poly1305_MACBYTES) ? 0 : clen - crypto_box_curve25519xchacha20poly1305_MACBYTES"
      returns: m
      erlang:
        - params: [C, N, PK, SK]
    - name: detached
      doc: |
        Like `easy/4`, but returns the ciphertext and the `macbytes/0` byte
        authentication tag separately as `{C, MAC}`.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_box_curve25519xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: pk, size: crypto_box_curve25519xchacha20poly1305_PUBLICKEYBYTES}
        - {type: fixed, name: sk, size: crypto_box_curve25519xchacha20poly1305_SECRETKEYBYTES}
      outputs:
        - {name: c, size: mlen}
        - {name: mac, size: crypto_box_curve25519xchacha20poly1305_MACBYTES}
      returns: [c, mac]
      erlang:
        - params: [M, N, PK, SK]
    - name: open_detached
      doc: |
        Verify the detached tag `MAC` and decrypt `C` with the nonce `N`, the
        sender's public key `PK`, and the recipient's secret key `SK`.

        Returns the plaintext, or `-1` when verification fails.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: mac, size: crypto_box_curve25519xchacha20poly1305_MACBYTES}
        - {type: fixed, name: n, size: crypto_box_curve25519xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: pk, size: crypto_box_curve25519xchacha20poly1305_PUBLICKEYBYTES}
        - {type: fixed, name: sk, size: crypto_box_curve25519xchacha20poly1305_SECRETKEYBYTES}
      outputs:
        - {name: m, size: clen}
      call: crypto_box_curve25519xchacha20poly1305_open_detached(m, c, mac, clen, n, pk, sk)
      returns: m
      erlang:
        - params: [C, MAC, N, PK, SK]
    - name: beforenm
      doc: |
        Precompute the `beforenmbytes/0` byte shared key for the public key `PK`
        and the secret key `SK`, for use with the `_afternm` functions.

        Returns `-1` when `PK` is a low-order point.
      args:
        - {type: fixed, name: pk, size: crypto_box_curve25519xchacha20poly1305_PUBLICKEYBYTES}
        - {type: fixed, name: sk, size: crypto_box_curve25519xchacha20poly1305_SECRETKEYBYTES}
      outputs:
        - {name: k, size: crypto_box_curve25519xchacha20poly1305_BEFORENMBYTES}
      returns: k
      erlang:
        - params: [PK, SK]
    - name: easy_afternm
      doc: Like `easy/4`, using the shared key `K` precomputed by `beforenm/2`.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_box_curve25519xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_box_curve25519xchacha20poly1305_BEFORENMBYTES}
      outputs:
        - {name: c, size: "mlen + crypto_box_curve25519xchacha20poly1305_MACBYTES"}
      returns: c
      erlang:
        - params: [M, N, K]
    - name: open_easy_afternm
      doc: |
        Like `open_easy/4`, using the shared key `K` precomputed by
        `beforenm/2`. Returns `-1` when verification fails.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: n, size: crypto_box_curve25519xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_box_curve25519xchacha20poly1305_BEFORENMBYTES}
      outputs:
        - name: m
          size: "(clen < crypto_box_curve25519xchacha20poly1305_MACBYTES) ? 0 : clen - crypto_box_curve25519xchacha20poly1305_MACBYTES"
      returns: m
      erlang:
        - params: [C, N, K]
    - name: detached_afternm
      doc: |
        Like `detached/4`, using the shared key `K` precomputed by `beforenm/2`.
        Returns `{C, MAC}`.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_box_curve25519xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_box_curve25519xchacha20poly1305_BEFORENMBYTES}
      outputs:
        - {name: c, size: mlen}
        - {name: mac, size: crypto_box_curve25519xchacha20poly1305_MACBYTES}
      returns: [c, mac]
      erlang:
        - params: [M, N, K]
    - name: open_detached_afternm
      doc: |
        Like `open_detached/5`, using the shared key `K` precomputed by
        `beforenm/2`. Returns `-1` when verification fails.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: mac, size: crypto_box_curve25519xchacha20poly1305_MACBYTES}
        - {type: fixed, name: n, size: crypto_box_curve25519xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_box_curve25519xchacha20poly1305_BEFORENMBYTES}
      outputs:
        - {name: m, size: clen}
      call: crypto_box_curve25519xchacha20poly1305_open_detached_afternm(m, c, mac, clen, n, k)
      returns: m
      erlang:
        - params: [C, MAC, N, K]
    - name: seal
      doc: |
        Anonymously encrypt `M` for the recipient's public key `PK` using a new
        ephemeral key pair. The result is `sealbytes/0` bytes longer than `M`.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: pk, size: crypto_box_curve25519xchacha20poly1305_PUBLICKEYBYTES}
      outputs:
        - {name: c, size: "mlen + crypto_box_curve25519xchacha20poly1305_SEALBYTES"}
      returns: c
      erlang:
        - params: [M, PK]
    - name: seal_open
      doc: |
        Open the sealed box `C` with the recipient's key pair `PK` and `SK`.

        Returns the plaintext, or `-1` when verification fails. Raises `badarg`
        when `C` is shorter than `sealbytes/0`.
      args:
        - {type: binary, name: c, min: crypto_box_curve25519xchacha20poly1305_SEALBYTES}
        - {type: fixed, name: pk, size: crypto_box_curve25519xchacha20poly1305_PUBLICKEYBYTES}
        - {type: fixed, name: sk, size: crypto_box_curve25519xchacha20poly1305_SECRETKEYBYTES}
      outputs:
        - name: m
          size: "(clen < crypto_box_curve25519xchacha20poly1305_SEALBYTES) ? 0 : clen - crypto_box_curve25519xchacha20poly1305_SEALBYTES"
      returns: m
      erlang:
        - params: [C, PK, SK]
  tests:
    - name: round_trips
      code: |
        Mod = libsodium_crypto_box_curve25519xchacha20poly1305,
        {PK1, SK1} = Mod:keypair(),
        {PK2, SK2} = Mod:keypair(),
        N = libsodium_randombytes:buf(Mod:noncebytes()),
        M = <<"attack at dawn">>,
        C = Mod:easy(M, N, PK2, SK1),
        30 = byte_size(C),
        M = Mod:open_easy(C, N, PK1, SK2),
        {CD, MAC} = Mod:detached(M, N, PK2, SK1),
        C = <<MAC/binary, CD/binary>>,
        M = Mod:open_detached(CD, MAC, N, PK1, SK2),
        K = Mod:beforenm(PK2, SK1),
        K = Mod:beforenm(PK1, SK2),
        C = Mod:easy_afternm(M, N, K),
        M = Mod:open_easy_afternm(C, N, K),
        {CD, MAC} = Mod:detached_afternm(M, N, K),
        M = Mod:open_detached_afternm(CD, MAC, N, K),
        Sealed = Mod:seal(M, PK2),
        62 = byte_size(Sealed),
        M = Mod:seal_open(Sealed, PK2, SK2),
        Seed = libsodium_randombytes:buf(Mod:seedbytes()),
        {SPK, SSK} = Mod:seed_keypair(Seed),
        {SPK, SSK} = Mod:seed_keypair(Seed),
        {SPK, _} = crypto:generate_key(ecdh, x25519, SSK).
    - name: forgery
      code: |
        Mod = libsodium_crypto_box_curve25519xchacha20poly1305,
        {PK1, SK1} = Mod:keypair(),
        {PK2, SK2} = Mod:keypair(),
        N = libsodium_randombytes:buf(Mod:noncebytes()),
        <<B, Rest/binary>> = Mod:easy(<<"message">>, N, PK2, SK1),
        -1 = Mod:open_easy(<<(B bxor 1), Rest/binary>>, N, PK1, SK2),
        -1 = Mod:open_easy(<<1, 2, 3>>, N, PK1, SK2),
        -1 = Mod:open_easy_afternm(<<>>, N, Mod:beforenm(PK1, SK2)),
        {CD, _} = Mod:detached(<<"message">>, N, PK2, SK1),
        -1 = Mod:open_detached(CD, <<0:128>>, N, PK1, SK2),
        Sealed = Mod:seal(<<"message">>, PK2),
        -1 = Mod:seal_open(Sealed, PK1, SK1),
        -1 = Mod:seal_open(binary:part(Sealed, 0, 48), PK2, SK2),
        -1 = Mod:beforenm(<<0:256>>, SK1).
    - name: badarg
      code: |
        Mod = libsodium_crypto_box_curve25519xchacha20poly1305,
        {PK, SK} = Mod:keypair(),
        N = libsodium_randombytes:buf(Mod:noncebytes()),
        badarg = try Mod:easy(<<"m">>, <<0:64>>, PK, SK) catch error:badarg -> badarg end,
        badarg = try Mod:open_easy(<<"c">>, N, <<0:248>>, SK) catch error:badarg -> badarg end,
        badarg = try Mod:seal_open(<<0:376>>, PK, SK) catch error:badarg -> badarg end,
        badarg = try Mod:seed_keypair(<<0:248>>) catch error:badarg -> badarg end,
        badarg = try Mod:easy_afternm(<<"m">>, N, <<0:248>>) catch error:badarg -> badarg end.
