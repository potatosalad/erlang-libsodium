# yaml-language-server: $schema=../namespace.schema.json
crypto_verify_32:
  title: 32-byte comparison
  doc: |
    Constant-time comparison of two `bytes/0` (32) byte secrets, such as
    authentication tags, whose timing does not depend on where they differ.

    Returns `0` when the binaries are equal and `-1` otherwise. Both arguments
    must be exactly `bytes/0` bytes long.
  example: |
    Tag = libsodium_randombytes:buf(libsodium_crypto_verify_32:bytes()),
    0 = libsodium_crypto_verify_32:crypto_verify_32(Tag, Tag),
    <<First, Rest/binary>> = Tag,
    -1 = libsodium_crypto_verify_32:crypto_verify_32(Tag, <<(First bxor 1), Rest/binary>>).
  constants:
    - name: bytes
      value: 32
  functions:
    - name: crypto_verify_32
      c: crypto_verify_32
      doc: Compare `X` and `Y` in constant time; returns `0` when they are equal and `-1` otherwise.
      args:
        - {type: fixed, name: x, size: crypto_verify_32_BYTES}
        - {type: fixed, name: y, size: crypto_verify_32_BYTES}
      check: none
      returns: "int:rc"
      spec: "0 | -1"
  tests:
    - name: differences
      code: |
        X = binary:copy(<<16#5a>>, 32),
        0 = libsodium_crypto_verify_32:crypto_verify_32(X, binary:copy(<<16#5a>>, 32)),
        -1 = libsodium_crypto_verify_32:crypto_verify_32(X, <<16#5b, (binary:part(X, 1, 32 - 1))/binary>>),
        -1 = libsodium_crypto_verify_32:crypto_verify_32(X, <<(binary:part(X, 0, 32 - 1))/binary, 16#da>>),
        badarg = try libsodium_crypto_verify_32:crypto_verify_32(X, <<X/binary, 0>>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_verify_32:crypto_verify_32(<<>>, X) catch error:badarg -> badarg end.
