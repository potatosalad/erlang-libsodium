# yaml-language-server: $schema=../namespace.schema.json
crypto_shorthash:
  title: Short-input hashing
  doc: |
    Keyed hashing of short inputs with the default construction, currently
    SipHash-2-4, producing `bytes/0` byte (64-bit) outputs under a
    `keybytes/0` byte secret key.

    It is designed for hash tables, Bloom filters, and similar structures
    where an attacker must not be able to predict collisions. It is **not** a
    general-purpose or collision-resistant cryptographic hash; use
    `m:libsodium_crypto_generichash` for that.
  example: |
    Key = libsodium_crypto_shorthash:keygen(),
    Hash = libsodium_crypto_shorthash:crypto_shorthash(<<"short input">>, Key),
    8 = byte_size(Hash),
    Hash = libsodium_crypto_shorthash_siphash24:crypto_shorthash_siphash24(<<"short input">>, Key).
  see_also: [libsodium_crypto_shorthash_siphash24, libsodium_crypto_shorthash_siphashx24]
  constants:
    - name: bytes
      value: 8
    - name: keybytes
      value: 16
    - name: primitive
      type: atom
      value: siphash24
  functions:
    - name: crypto_shorthash
      c: crypto_shorthash
      doc: Hash `In` under the `keybytes/0` byte key `K`, returning `bytes/0` bytes.
      args:
        - {type: binary, name: in}
        - {type: fixed, name: k, size: crypto_shorthash_KEYBYTES}
      outputs:
        - {name: out, size: crypto_shorthash_BYTES}
      returns: out
    - name: keygen
      doc: Generate a random `keybytes/0` byte key.
      outputs:
        - {name: k, size: crypto_shorthash_KEYBYTES}
      rc_type: void
      check: none
      returns: k
  tests:
    - name: known_answer
      code: |
        Key = list_to_binary(lists:seq(0, 15)),
        <<16#31, 16#0e, 16#0e, 16#dd, 16#47, 16#db, 16#6f, 16#72>> = libsodium_crypto_shorthash:crypto_shorthash(<<>>, Key),
        badarg = try libsodium_crypto_shorthash:crypto_shorthash(<<>>, <<Key/binary, 0>>) catch error:badarg -> badarg end.
