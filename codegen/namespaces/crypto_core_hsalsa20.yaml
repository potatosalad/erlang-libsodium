# yaml-language-server: $schema=../namespace.schema.json
crypto_core_hsalsa20:
  title: HSalsa20 core
  doc: |
    The HSalsa20 core function, which derives a `outputbytes/0` byte subkey
    from a `keybytes/0` byte key and a `inputbytes/0` byte input. It is the
    building block of XSalsa20 and of the `crypto_box` key derivation.

    The `constbytes/0` byte constant `C` is normally the 16-byte string
    `<<"expand 32-byte k">>`. This is a low-level primitive: it is not a
    general-purpose key derivation function, and the key must be secret and
    uniformly random.
  example: |
    Key = libsodium_randombytes:buf(libsodium_crypto_core_hsalsa20:keybytes()),
    In = libsodium_randombytes:buf(libsodium_crypto_core_hsalsa20:inputbytes()),
    Out = libsodium_crypto_core_hsalsa20:crypto_core_hsalsa20(In, Key, <<"expand 32-byte k">>),
    32 = byte_size(Out),
    Out = libsodium_crypto_core_hsalsa20:crypto_core_hsalsa20(In, Key, <<"expand 32-byte k">>).
  constants:
    - name: outputbytes
      value: 32
    - name: inputbytes
      value: 16
    - name: keybytes
      value: 32
    - name: constbytes
      value: 16
  functions:
    - name: crypto_core_hsalsa20
      c: crypto_core_hsalsa20
      doc: |
        Compute the HSalsa20 core of the `inputbytes/0` byte input `In`
        with the `keybytes/0` byte key `K` and the `constbytes/0` byte constant
        `C`, returning `outputbytes/0` bytes.
      args:
        - {type: fixed, name: in, size: crypto_core_hsalsa20_INPUTBYTES}
        - {type: fixed, name: k, size: crypto_core_hsalsa20_KEYBYTES}
        - {type: fixed, name: c, size: crypto_core_hsalsa20_CONSTBYTES}
      outputs:
        - {name: out, size: crypto_core_hsalsa20_OUTPUTBYTES}
      rc_type: void
      check: none
      returns: out
      erlang:
        - params: [In, K, C]
  tests:
    - name: hsalsa20_vector
      code: |
        K = binary:decode_hex(<<"4a5d9d5ba4ce2de1728e3bf480350f25e07e21c947d19e3376f09b3c1e161742">>),
        Expected = binary:decode_hex(<<"1b27556473e985d462cd51197a9a46c76009549eac6474f206c4ee0844f68389">>),
        Expected = libsodium_crypto_core_hsalsa20:crypto_core_hsalsa20(<<0:128>>, K, <<"expand 32-byte k">>).
    - name: badarg
      code: |
        K = libsodium_randombytes:buf(32),
        badarg = try libsodium_crypto_core_hsalsa20:crypto_core_hsalsa20(<<0:120>>, K, <<"expand 32-byte k">>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_core_hsalsa20:crypto_core_hsalsa20(<<0:128>>, <<K/binary, 0>>, <<"expand 32-byte k">>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_core_hsalsa20:crypto_core_hsalsa20(<<0:128>>, K, <<>>) catch error:badarg -> badarg end.
