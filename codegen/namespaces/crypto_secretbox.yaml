# yaml-language-server: $schema=../namespace.schema.json
crypto_secretbox:
  title: Secret-key authenticated encryption
  doc: |
    Secret-key authenticated encryption with XSalsa20-Poly1305 (see
    `primitive/0`).

    `easy/3` returns the `macbytes/0` byte authentication tag followed by the
    ciphertext, and `detached/3` returns them separately. Keys are
    `keybytes/0` bytes and nonces `noncebytes/0` bytes; the nonce is long
    enough to be generated at random, but must never be reused with the same
    key.

    `crypto_secretbox/3` and `open/3` are the NaCl compatibility interface,
    which requires `zerobytes/0` leading zero bytes of padding on the
    plaintext and produces (and expects) `boxzerobytes/0` leading zero bytes
    on the ciphertext. New code should use `easy/3` and `open_easy/3`.
  example: |
    Key = libsodium_crypto_secretbox:keygen(),
    Nonce = libsodium_randombytes:buf(libsodium_crypto_secretbox:noncebytes()),
    Ciphertext = libsodium_crypto_secretbox:easy(<<"message">>, Nonce, Key),
    <<"message">> = libsodium_crypto_secretbox:open_easy(Ciphertext, Nonce, Key).
  constants:
    - name: keybytes
      value: 32
    - name: noncebytes
      value: 24
    - name: macbytes
      value: 16
    - name: primitive
      type: atom
      value: xsalsa20poly1305
    - name: messagebytes_max
    - name: zerobytes
      value: 32
    - name: boxzerobytes
      value: 16
  functions:
    - name: easy
      doc: |
        Encrypt and authenticate `M` with the `noncebytes/0` byte nonce `N`
        and the `keybytes/0` byte key `K`.

        Returns the `macbytes/0` byte authentication tag followed by the
        ciphertext, or `-1` on failure.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_secretbox_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_KEYBYTES}
      outputs:
        - {name: c, size: "mlen + crypto_secretbox_MACBYTES"}
      returns: c
    - name: open_easy
      doc: |
        Verify and decrypt the ciphertext `C` produced by `easy/3` with the
        nonce `N` and key `K`. Returns the plaintext, or `-1` when
        verification fails or `C` is shorter than `macbytes/0`.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: n, size: crypto_secretbox_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_KEYBYTES}
      outputs:
        - {name: m, size: "(clen < crypto_secretbox_MACBYTES) ? 0 : clen - crypto_secretbox_MACBYTES"}
      returns: m
    - name: detached
      doc: |
        Encrypt and authenticate `M` with the nonce `N` and key `K`, returning
        the ciphertext and the `macbytes/0` byte authentication tag
        separately as `{C, MAC}`, or `-1` on failure.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_secretbox_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_KEYBYTES}
      outputs:
        - {name: c, size: mlen}
        - {name: mac, size: crypto_secretbox_MACBYTES}
      returns: [c, mac]
    - name: open_detached
      doc: |
        Verify the detached tag `MAC` and decrypt `C` with the nonce `N` and
        key `K`. Returns the plaintext, or `-1` when verification fails.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: mac, size: crypto_secretbox_MACBYTES}
        - {type: fixed, name: n, size: crypto_secretbox_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_KEYBYTES}
      outputs:
        - {name: m, size: clen}
      call: crypto_secretbox_open_detached(m, c, mac, clen, n, k)
      returns: m
      erlang:
        - params: [C, MAC, N, K]
    - name: keygen
      doc: Generate a random `keybytes/0` byte key.
      outputs:
        - {name: k, size: crypto_secretbox_KEYBYTES}
      rc_type: void
      check: none
      returns: k
    - name: crypto_secretbox
      c: crypto_secretbox
      doc: |
        NaCl compatibility interface: encrypt `M`, which must start with
        `zerobytes/0` zero bytes, with the nonce `N` and key `K`.

        Returns a ciphertext of the same length as `M` that starts with
        `boxzerobytes/0` zero bytes, followed by the authentication tag and
        the encrypted message, or `-1` when `M` is shorter than
        `zerobytes/0`. Non-zero padding bytes leak the authentication key.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_secretbox_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_KEYBYTES}
      outputs:
        - {name: c, size: mlen}
      returns: c
    - name: open
      doc: |
        NaCl compatibility interface: verify and decrypt `C`, which must
        start with `boxzerobytes/0` zero bytes, with the nonce `N` and key
        `K`.

        Returns a plaintext of the same length as `C` that starts with
        `zerobytes/0` zero bytes, or `-1` when verification fails or `C` is
        shorter than `zerobytes/0`.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: n, size: crypto_secretbox_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_KEYBYTES}
      outputs:
        - {name: m, size: clen}
      returns: m
  tests:
    - name: easy_matches_detached
      code: |
        K = libsodium_crypto_secretbox:keygen(),
        N = libsodium_randombytes:buf(24),
        M = libsodium_randombytes:buf(100),
        {C, MAC} = libsodium_crypto_secretbox:detached(M, N, K),
        100 = byte_size(C),
        16 = byte_size(MAC),
        CT = <<MAC/binary, C/binary>>,
        CT = libsodium_crypto_secretbox:easy(M, N, K),
        M = libsodium_crypto_secretbox:open_easy(CT, N, K),
        M = libsodium_crypto_secretbox:open_detached(C, MAC, N, K),
        <<>> = libsodium_crypto_secretbox:open_easy(libsodium_crypto_secretbox:easy(<<>>, N, K), N, K).
    - name: nacl_interface
      code: |
        K = libsodium_crypto_secretbox:keygen(),
        N = libsodium_randombytes:buf(24),
        M = <<"NaCl compatible message">>,
        {C, MAC} = libsodium_crypto_secretbox:detached(M, N, K),
        Boxed = <<0:128, MAC/binary, C/binary>>,
        Boxed = libsodium_crypto_secretbox:crypto_secretbox(<<0:256, M/binary>>, N, K),
        Padded = <<0:256, M/binary>>,
        Padded = libsodium_crypto_secretbox:open(Boxed, N, K),
        -1 = libsodium_crypto_secretbox:crypto_secretbox(<<0:248>>, N, K),
        -1 = libsodium_crypto_secretbox:open(<<0:248>>, N, K).
    - name: tamper_and_badarg
      code: |
        K = libsodium_crypto_secretbox:keygen(),
        N = libsodium_randombytes:buf(24),
        <<B, Rest/binary>> = libsodium_crypto_secretbox:easy(<<"message">>, N, K),
        -1 = libsodium_crypto_secretbox:open_easy(<<(B bxor 1), Rest/binary>>, N, K),
        -1 = libsodium_crypto_secretbox:open_easy(<<"short">>, N, K),
        -1 = libsodium_crypto_secretbox:open_detached(<<"message">>, <<0:128>>, N, K),
        badarg = try libsodium_crypto_secretbox:easy(<<"m">>, <<0:64>>, K) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_secretbox:open_detached(<<"m">>, <<0:120>>, N, K) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_secretbox:easy(<<"m">>, N, <<K/binary, 0>>) catch error:badarg -> badarg end.
