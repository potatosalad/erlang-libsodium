# yaml-language-server: $schema=../namespace.schema.json
crypto_kdf_hkdf_sha256:
  title: HKDF-SHA-256
  doc: |
    HKDF ([RFC 5869](https://www.rfc-editor.org/rfc/rfc5869)) with
    HMAC-SHA-256. `extract/2` condenses input keying material, such as a
    Diffie-Hellman shared secret, and an optional salt into a `keybytes/0`
    byte pseudorandom key (PRK); `expand/3` then derives up to `bytes_max/0`
    bytes from the PRK for each context. A uniformly random key, such as one
    from `keygen/0`, can be used as the PRK directly.

    The extraction can also be streamed: `extract_init/1`,
    `extract_update/2`, and `extract_final/1` thread an opaque `t:state/0`,
    and each call returns a new state and leaves its argument unchanged.

    HKDF is mainly useful for interoperability with existing protocols. To
    derive subkeys from a uniformly random key, `m:libsodium_crypto_kdf` is
    simpler; to derive keys from passwords, use `m:libsodium_crypto_pwhash`.
  example: |
    PRK = libsodium_crypto_kdf_hkdf_sha256:extract(<<"salt">>, <<"input keying material">>),
    32 = byte_size(PRK),
    Key1 = libsodium_crypto_kdf_hkdf_sha256:expand(32, <<"encryption key">>, PRK),
    Key2 = libsodium_crypto_kdf_hkdf_sha256:expand(32, <<"authentication key">>, PRK),
    true = Key1 =/= Key2,
    State0 = libsodium_crypto_kdf_hkdf_sha256:extract_init(<<"salt">>),
    State1 = libsodium_crypto_kdf_hkdf_sha256:extract_update(State0, <<"input keying ">>),
    State2 = libsodium_crypto_kdf_hkdf_sha256:extract_update(State1, <<"material">>),
    PRK = libsodium_crypto_kdf_hkdf_sha256:extract_final(State2).
  see_also: [libsodium_crypto_kdf_hkdf_sha512, libsodium_crypto_kdf, libsodium_crypto_auth_hmacsha256]
  constants:
    - name: keybytes
      value: 32
    - name: bytes_min
      value: 0
    - name: bytes_max
      value: 8160
    - name: statebytes
      value: 208
  functions:
    - name: extract
      doc: |
        Extract a `keybytes/0` byte pseudorandom key from the input keying
        material `IKM` and the optional `Salt` (default empty).
      args:
        - {type: binary, name: salt, len_type: size_t, nullable: true}
        - {type: binary, name: ikm, len_type: size_t}
      outputs:
        - {name: prk, size: crypto_kdf_hkdf_sha256_KEYBYTES}
      returns: prk
      erlang:
        - params: [IKM]
          args: ["<<>>", IKM]
        - params: [Salt, IKM]
    - name: expand
      doc: |
        Derive `OutLen` bytes from the `keybytes/0` byte pseudorandom key `PRK`
        for the context `Ctx` (default empty).

        Returns `-1` when `OutLen` is greater than `bytes_max/0`.
      args:
        - {type: uint, name: out_len, c_type: size_t}
        - {type: binary, name: ctx, len_type: size_t}
        - {type: fixed, name: prk, size: crypto_kdf_hkdf_sha256_KEYBYTES}
      prelude: |
        if (out_len > crypto_kdf_hkdf_sha256_BYTES_MAX) {
            result = enif_make_int(env, -1);
            goto cleanup;
        }
      outputs:
        - {name: out, size: out_len}
      call: crypto_kdf_hkdf_sha256_expand(out, out_len, (const char *)ctx, ctxlen, prk)
      returns: out
      erlang:
        - params: [OutLen, PRK]
          args: [OutLen, "<<>>", PRK]
        - params: [OutLen, Ctx, PRK]
    - name: keygen
      doc: Generate a random `keybytes/0` byte pseudorandom key.
      outputs:
        - {name: prk, size: crypto_kdf_hkdf_sha256_KEYBYTES}
      rc_type: void
      check: none
      returns: prk
    - name: extract_init
      doc: Start a streaming extraction with the optional `Salt` (default empty) and return its state.
      args:
        - {type: binary, name: salt, len_type: size_t, nullable: true}
      outputs:
        - {type: state, name: state, c_type: crypto_kdf_hkdf_sha256_state}
      returns: state
      erlang:
        - params: []
          args: ["<<>>"]
        - params: [Salt]
    - name: extract_update
      doc: Absorb the input keying material `IKM` into `State` and return the updated state.
      args:
        - {type: state, name: state, c_type: crypto_kdf_hkdf_sha256_state}
        - {type: binary, name: ikm}
      update: true
      returns: state
    - name: extract_final
      doc: Finish the streaming extraction in `State`, returning a `keybytes/0` byte pseudorandom key.
      args:
        - {type: state, name: state, c_type: crypto_kdf_hkdf_sha256_state}
      outputs:
        - {name: prk, size: crypto_kdf_hkdf_sha256_KEYBYTES}
      call: crypto_kdf_hkdf_sha256_extract_final(&state, prk)
      returns: prk
  tests:
    - name: rfc5869_test_case_1
      code: |
        IKM = binary:copy(<<16#0b>>, 22),
        Salt = binary:decode_hex(<<"000102030405060708090a0b0c">>),
        Info = binary:decode_hex(<<"f0f1f2f3f4f5f6f7f8f9">>),
        PRK = binary:decode_hex(<<"077709362c2e32df0ddc3f0dc47bba6390b6c73bb50f9c3122ec844ad7c2b3e5">>),
        Okm = binary:decode_hex(<<"3cb25f25faacd57a90434f64d0362f2a2d2d0a90cf1a5a4c5db02d56ecc4c5bf34007208d5b887185865">>),
        PRK = crypto:mac(hmac, sha256, Salt, IKM),
        PRK = libsodium_crypto_kdf_hkdf_sha256:extract(Salt, IKM),
        Okm = libsodium_crypto_kdf_hkdf_sha256:expand(42, Info, PRK),
        T1 = crypto:mac(hmac, sha256, PRK, <<Info/binary, 1>>),
        <<T1:32/binary, _/binary>> = Okm,
        EmptySaltPrk = crypto:mac(hmac, sha256, <<>>, IKM),
        EmptySaltPrk = libsodium_crypto_kdf_hkdf_sha256:extract(IKM),
        EmptySaltPrk = libsodium_crypto_kdf_hkdf_sha256:extract(<<>>, IKM),
        EmptyCtx = crypto:mac(hmac, sha256, PRK, <<1>>),
        EmptyCtx = libsodium_crypto_kdf_hkdf_sha256:expand(32, PRK),
        <<>> = libsodium_crypto_kdf_hkdf_sha256:expand(0, PRK).
    - name: streaming_matches_one_shot
      code: |
        Salt = <<"salt">>,
        Large = binary:copy(<<"0123456789abcdef">>, 20000),
        PRK = libsodium_crypto_kdf_hkdf_sha256:extract(Salt, <<Large/binary, Large/binary>>),
        State0 = libsodium_crypto_kdf_hkdf_sha256:extract_init(Salt),
        true = is_reference(State0),
        State1 = libsodium_crypto_kdf_hkdf_sha256:extract_update(State0, Large),
        State2 = libsodium_crypto_kdf_hkdf_sha256:extract_update(State1, Large),
        PRK = libsodium_crypto_kdf_hkdf_sha256:extract_final(State2),
        PRK = libsodium_crypto_kdf_hkdf_sha256:extract_final(State2),
        EmptySaltPrk = libsodium_crypto_kdf_hkdf_sha256:extract(Large),
        EmptySaltPrk = libsodium_crypto_kdf_hkdf_sha256:extract_final(libsodium_crypto_kdf_hkdf_sha256:extract_update(libsodium_crypto_kdf_hkdf_sha256:extract_init(), Large)).
    - name: invalid_arguments
      code: |
        PRK = libsodium_crypto_kdf_hkdf_sha256:keygen(),
        32 = byte_size(PRK),
        Max = libsodium_crypto_kdf_hkdf_sha256:bytes_max(),
        Max = byte_size(libsodium_crypto_kdf_hkdf_sha256:expand(Max, <<"ctx">>, PRK)),
        -1 = libsodium_crypto_kdf_hkdf_sha256:expand(Max + 1, <<"ctx">>, PRK),
        -1 = libsodium_crypto_kdf_hkdf_sha256:expand(1 bsl 62, <<"ctx">>, PRK),
        badarg = try libsodium_crypto_kdf_hkdf_sha256:expand(-1, <<"ctx">>, PRK) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_kdf_hkdf_sha256:expand(32, <<"ctx">>, <<PRK/binary, 0>>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_kdf_hkdf_sha256:extract(not_a_binary, <<"ikm">>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_kdf_hkdf_sha256:extract_update(<<0:8>>, <<"ikm">>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_kdf_hkdf_sha256:extract_final(<<>>) catch error:badarg -> badarg end.
