# yaml-language-server: $schema=../namespace.schema.json
crypto_onetimeauth:
  title: One-time authentication
  doc: |
    One-time message authentication with the default construction, currently
    Poly1305.

    A `keybytes/0` byte key must be used to authenticate **a single message
    only**; reusing it lets an attacker forge tags. Derive a fresh key per
    message (for example from a stream cipher), or use
    `m:libsodium_crypto_auth` for a reusable key.

    The streaming functions thread an opaque `t:state/0` through `init/1`, `update/2`, and `final/1`; each call returns a new
    state and leaves its argument unchanged. Updates over large inputs yield to
    other processes between chunks.
  example: |
    Key = libsodium_crypto_onetimeauth:keygen(),
    Tag = libsodium_crypto_onetimeauth:crypto_onetimeauth(<<"message">>, Key),
    0 = libsodium_crypto_onetimeauth:verify(Tag, <<"message">>, Key),
    -1 = libsodium_crypto_onetimeauth:verify(Tag, <<"forged">>, Key),
    State0 = libsodium_crypto_onetimeauth:init(Key),
    State1 = libsodium_crypto_onetimeauth:update(State0, <<"mess">>),
    State2 = libsodium_crypto_onetimeauth:update(State1, <<"age">>),
    Tag = libsodium_crypto_onetimeauth:final(State2).
  see_also: [libsodium_crypto_onetimeauth_poly1305, libsodium_crypto_auth]
  constants:
    - name: statebytes
      value: 256
    - name: bytes
      value: 16
    - name: keybytes
      value: 32
    - name: primitive
      type: atom
      value: poly1305
  functions:
    - name: crypto_onetimeauth
      c: crypto_onetimeauth
      doc: Compute the `bytes/0` byte tag of `In` under the one-time `keybytes/0` byte key `K`.
      args:
        - {type: binary, name: in}
        - {type: fixed, name: k, size: crypto_onetimeauth_KEYBYTES}
      outputs:
        - {name: out, size: crypto_onetimeauth_BYTES}
      returns: out
    - name: verify
      doc: |
        Check in constant time that `H` is the tag of `In` under the key `K`.
        Returns `0` when it is valid and `-1` otherwise.
      args:
        - {type: fixed, name: h, size: crypto_onetimeauth_BYTES}
        - {type: binary, name: in}
        - {type: fixed, name: k, size: crypto_onetimeauth_KEYBYTES}
      check: none
      returns: "int:rc"
      spec: "0 | -1"
    - name: init
      doc: Start a streaming authenticator with the one-time `keybytes/0` byte `Key`.
      args:
        - {type: fixed, name: key, size: crypto_onetimeauth_KEYBYTES}
      outputs:
        - {type: state, name: state, c_type: crypto_onetimeauth_state}
      returns: state
    - name: update
      doc: Absorb `In` into `State` and return the updated state.
      args:
        - {type: state, name: state, c_type: crypto_onetimeauth_state}
        - {type: binary, name: in}
      update: true
      returns: state
    - name: final
      doc: Finish the streaming authenticator in `State`, returning a `bytes/0` byte tag.
      args:
        - {type: state, name: state, c_type: crypto_onetimeauth_state}
      outputs:
        - {name: out, size: crypto_onetimeauth_BYTES}
      call: crypto_onetimeauth_final(&state, out)
      returns: out
    - name: keygen
      doc: Generate a random `keybytes/0` byte key.
      outputs:
        - {name: k, size: crypto_onetimeauth_KEYBYTES}
      rc_type: void
      check: none
      returns: k
  tests:
    - name: known_answer
      code: |
        Key = libsodium_crypto_onetimeauth:keygen(),
        In = <<"Cryptographic Forum Research Group">>,
        Expected = crypto:mac(poly1305, Key, In),
        Expected = libsodium_crypto_onetimeauth:crypto_onetimeauth(In, Key),
        Expected = libsodium_crypto_onetimeauth_poly1305:crypto_onetimeauth_poly1305(In, Key).
    - name: streaming_matches_one_shot
      code: |
        Key = libsodium_crypto_onetimeauth:keygen(),
        Large = binary:copy(<<"0123456789abcdef">>, 20000),
        Tag = libsodium_crypto_onetimeauth:crypto_onetimeauth(<<Large/binary, Large/binary>>, Key),
        State0 = libsodium_crypto_onetimeauth:init(Key),
        State1 = libsodium_crypto_onetimeauth:update(State0, Large),
        State2 = libsodium_crypto_onetimeauth:update(State1, Large),
        Tag = libsodium_crypto_onetimeauth:final(State2),
        0 = libsodium_crypto_onetimeauth:verify(Tag, <<Large/binary, Large/binary>>, Key),
        -1 = libsodium_crypto_onetimeauth:verify(Tag, Large, Key).
    - name: badarg
      code: |
        Key = libsodium_crypto_onetimeauth:keygen(),
        badarg = try libsodium_crypto_onetimeauth:crypto_onetimeauth(<<"m">>, <<Key/binary, 0>>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_onetimeauth:verify(<<0:8>>, <<"m">>, Key) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_onetimeauth:init(<<>>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_onetimeauth:final(<<0:8>>) catch error:badarg -> badarg end.
