# yaml-language-server: $schema=../namespace.schema.json
crypto_secretstream_xchacha20poly1305:
  title: Encrypted streams
  doc: |
    Authenticated encryption of a sequence of messages with
    XChaCha20-Poly1305, detecting truncation, reordering, and duplication.

    The sender calls `init_push/1` with a `keybytes/0` byte key to obtain an
    opaque state binary of `statebytes/0` bytes and a `headerbytes/0` byte
    header to transmit, then `push/4` for each message. The receiver calls
    `init_pull/2` with the header and key and then `pull/3` for each
    ciphertext. Every call returns a new state and leaves its argument
    unchanged; reusing an old state re-encrypts with the same nonce and must
    be avoided.

    Each message carries a tag: `tag_message/0`, `tag_push/0` (end of a
    logical chunk), `tag_rekey/0` (derive a new key), or `tag_final/0` (end
    of the stream). Ciphertexts are `abytes/0` bytes longer than their
    messages.
  example: |
    Key = libsodium_crypto_secretstream_xchacha20poly1305:keygen(),
    {Push0, Header} = libsodium_crypto_secretstream_xchacha20poly1305:init_push(Key),
    {Push1, C1} = libsodium_crypto_secretstream_xchacha20poly1305:push(Push0, <<"hello">>, <<>>, libsodium_crypto_secretstream_xchacha20poly1305:tag_message()),
    {_, C2} = libsodium_crypto_secretstream_xchacha20poly1305:push(Push1, <<"world">>, <<>>, libsodium_crypto_secretstream_xchacha20poly1305:tag_final()),
    Pull0 = libsodium_crypto_secretstream_xchacha20poly1305:init_pull(Header, Key),
    {Pull1, <<"hello">>, 0} = libsodium_crypto_secretstream_xchacha20poly1305:pull(Pull0, C1, <<>>),
    {_, <<"world">>, 3} = libsodium_crypto_secretstream_xchacha20poly1305:pull(Pull1, C2, <<>>).
  constants:
    - name: abytes
      value: 17
    - name: headerbytes
      value: 24
    - name: keybytes
      value: 32
    - name: messagebytes_max
    - name: tag_message
      type: int
      value: 0
    - name: tag_push
      type: int
      value: 1
    - name: tag_rekey
      type: int
      value: 2
    - name: tag_final
      type: int
      value: 3
    - name: statebytes
      value: 52
  functions:
    - name: keygen
      doc: Generate a random `keybytes/0` byte key.
      outputs:
        - {name: k, size: crypto_secretstream_xchacha20poly1305_KEYBYTES}
      rc_type: void
      check: none
      returns: k
    - name: init_push
      doc: |
        Start an encrypted stream with the `keybytes/0` byte key `K`.

        Returns `{State, Header}`, where `Header` must be sent to the
        receiver for `init_pull/2`, or `-1` on failure.
      args:
        - {type: fixed, name: k, size: crypto_secretstream_xchacha20poly1305_KEYBYTES}
      outputs:
        - {type: state, name: state, c_type: crypto_secretstream_xchacha20poly1305_state}
        - {name: header, size: crypto_secretstream_xchacha20poly1305_HEADERBYTES}
      returns: [state, header]
    - name: push
      doc: |
        Encrypt `M` with the additional data `AD` (may be empty) and the tag
        `Tag` (an integer from `0` to `255`, normally one of the `tag_*`
        constants) using the stream `State`.

        Returns `{NewState, C}`, where `C` is `abytes/0` bytes longer than
        `M`, or `-1` on failure.
      args:
        - {type: state, name: state, c_type: crypto_secretstream_xchacha20poly1305_state}
        - {type: binary, name: m}
        - {type: binary, name: ad, nullable: true}
        - {type: uint, name: tag, c_type: unsigned char}
      outputs:
        - {name: c, size: "mlen + crypto_secretstream_xchacha20poly1305_ABYTES", len: clen}
      call: crypto_secretstream_xchacha20poly1305_push(&state, c, &clen, m, mlen, ad, adlen, tag)
      returns: [state, c]
      erlang:
        - params: [State, M, AD, Tag]
    - name: init_pull
      doc: |
        Start decrypting a stream from the `headerbytes/0` byte `Header`
        produced by `init_push/1` and the key `K`.

        Returns the stream state, or `-1` on failure.
      args:
        - {type: fixed, name: header, size: crypto_secretstream_xchacha20poly1305_HEADERBYTES}
        - {type: fixed, name: k, size: crypto_secretstream_xchacha20poly1305_KEYBYTES}
      outputs:
        - {type: state, name: state, c_type: crypto_secretstream_xchacha20poly1305_state}
      returns: state
    - name: pull
      doc: |
        Verify and decrypt the next ciphertext `C` (at least `abytes/0`
        bytes) with the additional data `AD` using the stream `State`.

        Returns `{NewState, M, Tag}`, or `-1` when `C` is invalid, out of
        order, or tampered with. A `tag_final/0` tag marks the end of the
        stream.
      args:
        - {type: state, name: state, c_type: crypto_secretstream_xchacha20poly1305_state}
        - {type: binary, name: c, min: crypto_secretstream_xchacha20poly1305_ABYTES}
        - {type: binary, name: ad, nullable: true}
      outputs:
        - {name: m, size: "clen - crypto_secretstream_xchacha20poly1305_ABYTES", len: mlen}
        - {type: scalar, name: tag, c_type: unsigned char}
      call: crypto_secretstream_xchacha20poly1305_pull(&state, m, &mlen, &tag, c, clen, ad, adlen)
      returns: [state, m, "uint:tag"]
      spec: "{binary(), binary(), 0..255} | -1"
      erlang:
        - params: [State, C, AD]
    - name: rekey
      doc: |
        Explicitly derive a new key for the stream `State` and return the
        updated state. The receiver must call `rekey/1` at the same point in
        the stream.
      args:
        - {type: state, name: state, c_type: crypto_secretstream_xchacha20poly1305_state}
      rc_type: void
      check: none
      returns: state
  tests:
    - name: round_trip
      code: |
        Mod = libsodium_crypto_secretstream_xchacha20poly1305,
        K = Mod:keygen(),
        {S0, Header} = Mod:init_push(K),
        52 = byte_size(S0),
        24 = byte_size(Header),
        {S1, C1} = Mod:push(S0, <<"first">>, <<"ad1">>, Mod:tag_message()),
        22 = byte_size(C1),
        {S2, C2} = Mod:push(S1, <<>>, <<>>, Mod:tag_push()),
        S3 = Mod:rekey(S2),
        {S4, C3} = Mod:push(S3, <<"after rekey">>, <<>>, Mod:tag_rekey()),
        {_, C4} = Mod:push(S4, <<"last">>, <<>>, Mod:tag_final()),
        P0 = Mod:init_pull(Header, K),
        {P1, <<"first">>, 0} = Mod:pull(P0, C1, <<"ad1">>),
        {P2, <<>>, 1} = Mod:pull(P1, C2, <<>>),
        P3 = Mod:rekey(P2),
        {P4, <<"after rekey">>, 2} = Mod:pull(P3, C3, <<>>),
        {_, <<"last">>, 3} = Mod:pull(P4, C4, <<>>).
    - name: tamper_and_reorder
      code: |
        Mod = libsodium_crypto_secretstream_xchacha20poly1305,
        K = Mod:keygen(),
        {S0, Header} = Mod:init_push(K),
        {S1, C1} = Mod:push(S0, <<"one">>, <<>>, 0),
        {_, C2} = Mod:push(S1, <<"two">>, <<>>, 0),
        P0 = Mod:init_pull(Header, K),
        -1 = Mod:pull(P0, C2, <<>>),
        -1 = Mod:pull(P0, C1, <<"wrong ad">>),
        <<B, Rest/binary>> = C1,
        -1 = Mod:pull(P0, <<(B bxor 1), Rest/binary>>, <<>>),
        {P1, <<"one">>, 0} = Mod:pull(P0, C1, <<>>),
        -1 = Mod:pull(P1, C1, <<>>),
        {_, <<"two">>, 0} = Mod:pull(P1, C2, <<>>).
    - name: badarg
      code: |
        Mod = libsodium_crypto_secretstream_xchacha20poly1305,
        K = Mod:keygen(),
        {S0, Header} = Mod:init_push(K),
        P0 = Mod:init_pull(Header, K),
        badarg = try Mod:init_push(<<0:248>>) catch error:badarg -> badarg end,
        badarg = try Mod:init_pull(<<0:8>>, K) catch error:badarg -> badarg end,
        badarg = try Mod:push(<<S0/binary, 0>>, <<"m">>, <<>>, 0) catch error:badarg -> badarg end,
        badarg = try Mod:push(S0, <<"m">>, <<>>, 256) catch error:badarg -> badarg end,
        badarg = try Mod:push(S0, <<"m">>, <<>>, -1) catch error:badarg -> badarg end,
        badarg = try Mod:pull(P0, <<0:128>>, <<>>) catch error:badarg -> badarg end,
        badarg = try Mod:rekey(<<>>) catch error:badarg -> badarg end.
