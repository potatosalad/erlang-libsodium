# yaml-language-server: $schema=../namespace.schema.json
crypto_kem_mlkem768:
  title: ML-KEM-768 key encapsulation
  doc: |
    Post-quantum key encapsulation with ML-KEM-768 (FIPS 203). Unless
    interoperability requires plain ML-KEM, prefer `m:libsodium_crypto_kem`,
    whose X-Wing default combines ML-KEM-768 with X25519.

    `enc/1` encapsulates a `sharedsecretbytes/0` byte shared secret `SS` to a
    `publickeybytes/0` byte public key `PK`, producing a `ciphertextbytes/0`
    byte ciphertext `CT`; `dec/2` recovers `SS` from `CT` with the
    `secretkeybytes/0` byte secret key `SK`.

    The `seedbytes/0` byte key generation seed and the 32-byte encapsulation
    seed of `enc_deterministic/2` must be secret and uniformly random; they
    exist for known-answer tests and deterministic derivation.
  example: |
    {PK, SK} = libsodium_crypto_kem_mlkem768:keypair(),
    {CT, SS} = libsodium_crypto_kem_mlkem768:enc(PK),
    SS = libsodium_crypto_kem_mlkem768:dec(CT, SK).
  constants:
    - name: publickeybytes
      value: 1184
    - name: secretkeybytes
      value: 2400
    - name: ciphertextbytes
      value: 1088
    - name: sharedsecretbytes
      value: 32
    - name: seedbytes
      value: 64
  functions:
    - name: seed_keypair
      doc: |
        Deterministically derive a key pair from the `seedbytes/0` byte `Seed`
        (the FIPS 203 `d || z`), which must be secret and uniformly random.
        Returns `{PK, SK}`.
      args:
        - {type: fixed, name: seed, size: crypto_kem_mlkem768_SEEDBYTES}
      outputs:
        - {name: pk, size: crypto_kem_mlkem768_PUBLICKEYBYTES}
        - {name: sk, size: crypto_kem_mlkem768_SECRETKEYBYTES}
      returns: [pk, sk]
      erlang:
        - params: [Seed]
    - name: keypair
      doc: Generate a random key pair. Returns `{PK, SK}`.
      outputs:
        - {name: pk, size: crypto_kem_mlkem768_PUBLICKEYBYTES}
        - {name: sk, size: crypto_kem_mlkem768_SECRETKEYBYTES}
      returns: [pk, sk]
    - name: enc
      doc: |
        Encapsulate a fresh random shared secret to the public key `PK`.
        Returns `{CT, SS}`, or `-1` when `PK` is not a valid encoding.
      args:
        - {type: fixed, name: pk, size: crypto_kem_mlkem768_PUBLICKEYBYTES}
      outputs:
        - {name: ct, size: crypto_kem_mlkem768_CIPHERTEXTBYTES}
        - {name: ss, size: crypto_kem_mlkem768_SHAREDSECRETBYTES}
      returns: [ct, ss]
      erlang:
        - params: [PK]
    - name: enc_deterministic
      doc: |
        Encapsulate to the public key `PK` using the 32-byte `Seed` (the
        FIPS 203 message `m`) instead of fresh randomness. `Seed` must be
        secret, uniformly random, and never reused. Returns `{CT, SS}`, or `-1`
        when `PK` is not a valid encoding.
      args:
        - {type: fixed, name: pk, size: crypto_kem_mlkem768_PUBLICKEYBYTES}
        # The header declares `seed[32]`; libsodium has no macro for it.
        - {type: fixed, name: seed, size: "32"}
      outputs:
        - {name: ct, size: crypto_kem_mlkem768_CIPHERTEXTBYTES}
        - {name: ss, size: crypto_kem_mlkem768_SHAREDSECRETBYTES}
      returns: [ct, ss]
      erlang:
        - params: [PK, Seed]
    - name: dec
      doc: |
        Decapsulate the ciphertext `CT` with the secret key `SK` and return the
        shared secret `SS`.

        A tampered or mismatched `CT` does not fail: implicit rejection returns
        a pseudorandom secret unrelated to the sender's, so the mismatch only
        surfaces when the secrets are used.
      args:
        - {type: fixed, name: ct, size: crypto_kem_mlkem768_CIPHERTEXTBYTES}
        - {type: fixed, name: sk, size: crypto_kem_mlkem768_SECRETKEYBYTES}
      outputs:
        - {name: ss, size: crypto_kem_mlkem768_SHAREDSECRETBYTES}
      returns: ss
      erlang:
        - params: [CT, SK]
  tests:
    - name: known_answer
      code: |
        % NIST KAT vector 1 (libsodium test/default/kem_mlkem768.c).
        D = binary:decode_hex(<<"7c9935a0b07694aa0c6d10e4db6b1add2fd81a25ccb148032dcd739936737f2d">>),
        Z = binary:decode_hex(<<"b505d7cfad1b497499323c8686325e4792f267aafa3f87ca60d01cb54f29202a">>),
        M = binary:decode_hex(<<"eb4a7c66ef4eba2ddb38c88d8bc706b1d639002198172a7b1942eca8f6c001ba">>),
        {PK, SK} = libsodium_crypto_kem_mlkem768:seed_keypair(<<D/binary, Z/binary>>),
        <<PKPrefix:32/binary, _/binary>> = PK,
        PKPrefix = binary:decode_hex(<<"a8e651a1e685f22478a8954f007bc7711b930772c78f092e82878e3e937f3679">>),
        {CT, SS} = libsodium_crypto_kem_mlkem768:enc_deterministic(PK, M),
        <<CTPrefix:32/binary, _/binary>> = CT,
        CTPrefix = binary:decode_hex(<<"3b835a5fa145387a0819c4daa1e65fbe2ba5400afcd640bbddbbe3585f24bedd">>),
        SS = binary:decode_hex(<<"ac865f839fef1bf3d528dd7504bed2f64b5502b0fa81d1c32763658e4aac5037">>),
        SS = libsodium_crypto_kem_mlkem768:dec(CT, SK).
    - name: implicit_rejection
      code: |
        {PK, SK} = libsodium_crypto_kem_mlkem768:keypair(),
        {<<Byte, Rest/binary>>, SS} = libsodium_crypto_kem_mlkem768:enc(PK),
        Tampered = <<(Byte bxor 1), Rest/binary>>,
        Other = libsodium_crypto_kem_mlkem768:dec(Tampered, SK),
        32 = byte_size(Other),
        true = Other =/= SS,
        Other = libsodium_crypto_kem_mlkem768:dec(Tampered, SK).
    - name: errors
      code: |
        {PK, SK} = libsodium_crypto_kem_mlkem768:keypair(),
        {CT, _} = libsodium_crypto_kem_mlkem768:enc(PK),
        BadPK = binary:copy(<<255>>, libsodium_crypto_kem_mlkem768:publickeybytes()),
        -1 = libsodium_crypto_kem_mlkem768:enc(BadPK),
        -1 = libsodium_crypto_kem_mlkem768:enc_deterministic(BadPK, <<0:256>>),
        badarg = try libsodium_crypto_kem_mlkem768:seed_keypair(<<0:256>>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_kem_mlkem768:enc(<<PK/binary, 0>>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_kem_mlkem768:enc_deterministic(PK, <<0:512>>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_kem_mlkem768:dec(CT, <<SK/binary, 0>>) catch error:badarg -> badarg end.
