# yaml-language-server: $schema=../namespace.schema.json
crypto_secretbox_xchacha20poly1305:
  title: XChaCha20-Poly1305 secret box
  doc: |
    Secret-key authenticated encryption with XChaCha20-Poly1305, using the
    same box layout as `m:libsodium_crypto_secretbox`.

    `easy/3` returns the `macbytes/0` byte authentication tag followed by the
    ciphertext, and `detached/3` returns them separately. Keys are
    `keybytes/0` bytes and nonces `noncebytes/0` bytes; the nonce can be
    generated at random but must never be reused with the same key. There is
    no `keygen` function: use `libsodium_randombytes:buf/1` with
    `keybytes/0`.
  example: |
    Key = libsodium_randombytes:buf(libsodium_crypto_secretbox_xchacha20poly1305:keybytes()),
    Nonce = libsodium_randombytes:buf(libsodium_crypto_secretbox_xchacha20poly1305:noncebytes()),
    Ciphertext = libsodium_crypto_secretbox_xchacha20poly1305:easy(<<"message">>, Nonce, Key),
    <<"message">> = libsodium_crypto_secretbox_xchacha20poly1305:open_easy(Ciphertext, Nonce, Key).
  constants:
    - name: keybytes
      value: 32
    - name: noncebytes
      value: 24
    - name: macbytes
      value: 16
    - name: messagebytes_max
  functions:
    - name: easy
      doc: |
        Encrypt and authenticate `M` with the `noncebytes/0` byte nonce `N`
        and the `keybytes/0` byte key `K`.

        Returns the `macbytes/0` byte authentication tag followed by the
        ciphertext, or `-1` on failure.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_secretbox_xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_xchacha20poly1305_KEYBYTES}
      outputs:
        - {name: c, size: "mlen + crypto_secretbox_xchacha20poly1305_MACBYTES"}
      returns: c
    - name: open_easy
      doc: |
        Verify and decrypt the ciphertext `C` produced by `easy/3` with the
        nonce `N` and key `K`. Returns the plaintext, or `-1` when
        verification fails or `C` is shorter than `macbytes/0`.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: n, size: crypto_secretbox_xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_xchacha20poly1305_KEYBYTES}
      outputs:
        - {name: m, size: "(clen < crypto_secretbox_xchacha20poly1305_MACBYTES) ? 0 : clen - crypto_secretbox_xchacha20poly1305_MACBYTES"}
      returns: m
    - name: detached
      doc: |
        Encrypt and authenticate `M` with the nonce `N` and key `K`, returning
        the ciphertext and the `macbytes/0` byte authentication tag
        separately as `{C, MAC}`, or `-1` on failure.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_secretbox_xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_xchacha20poly1305_KEYBYTES}
      outputs:
        - {name: c, size: mlen}
        - {name: mac, size: crypto_secretbox_xchacha20poly1305_MACBYTES}
      returns: [c, mac]
    - name: open_detached
      doc: |
        Verify the detached tag `MAC` and decrypt `C` with the nonce `N` and
        key `K`. Returns the plaintext, or `-1` when verification fails.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: mac, size: crypto_secretbox_xchacha20poly1305_MACBYTES}
        - {type: fixed, name: n, size: crypto_secretbox_xchacha20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_xchacha20poly1305_KEYBYTES}
      outputs:
        - {name: m, size: clen}
      call: crypto_secretbox_xchacha20poly1305_open_detached(m, c, mac, clen, n, k)
      returns: m
      erlang:
        - params: [C, MAC, N, K]
  tests:
    - name: easy_matches_detached
      code: |
        K = libsodium_randombytes:buf(32),
        N = libsodium_randombytes:buf(24),
        M = libsodium_randombytes:buf(100),
        {C, MAC} = libsodium_crypto_secretbox_xchacha20poly1305:detached(M, N, K),
        100 = byte_size(C),
        16 = byte_size(MAC),
        CT = <<MAC/binary, C/binary>>,
        CT = libsodium_crypto_secretbox_xchacha20poly1305:easy(M, N, K),
        M = libsodium_crypto_secretbox_xchacha20poly1305:open_easy(CT, N, K),
        M = libsodium_crypto_secretbox_xchacha20poly1305:open_detached(C, MAC, N, K),
        <<>> = libsodium_crypto_secretbox_xchacha20poly1305:open_easy(libsodium_crypto_secretbox_xchacha20poly1305:easy(<<>>, N, K), N, K).
    - name: tamper_and_badarg
      code: |
        K = libsodium_randombytes:buf(32),
        N = libsodium_randombytes:buf(24),
        <<B, Rest/binary>> = libsodium_crypto_secretbox_xchacha20poly1305:easy(<<"message">>, N, K),
        -1 = libsodium_crypto_secretbox_xchacha20poly1305:open_easy(<<(B bxor 1), Rest/binary>>, N, K),
        -1 = libsodium_crypto_secretbox_xchacha20poly1305:open_easy(<<"short">>, N, K),
        -1 = libsodium_crypto_secretbox_xchacha20poly1305:open_detached(<<"message">>, <<0:128>>, N, K),
        badarg = try libsodium_crypto_secretbox_xchacha20poly1305:easy(<<"m">>, <<0:64>>, K) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_secretbox_xchacha20poly1305:open_detached(<<"m">>, <<0:120>>, N, K) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_secretbox_xchacha20poly1305:easy(<<"m">>, N, <<K/binary, 0>>) catch error:badarg -> badarg end.
