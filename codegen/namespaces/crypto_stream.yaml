# yaml-language-server: $schema=../namespace.schema.json
crypto_stream:
  title: Stream cipher
  doc: |
    The default stream cipher, currently XSalsa20 (see `primitive/0`).

    `crypto_stream/3` returns raw keystream and `'xor'/3` encrypts or decrypts
    by combining a message with it. The `noncebytes/0` byte nonce is long
    enough to be chosen at random for every message.

    This is not authenticated encryption: ciphertexts can be modified without
    detection, so pair it with a MAC or use `m:libsodium_crypto_secretbox`
    instead. A nonce must never be reused with the same key.
  example: |
    K = libsodium_crypto_stream:keygen(),
    N = libsodium_randombytes:buf(libsodium_crypto_stream:noncebytes()),
    C = libsodium_crypto_stream:'xor'(<<"message">>, N, K),
    <<"message">> = libsodium_crypto_stream:'xor'(C, N, K).
  constants:
    - name: keybytes
      value: 32
    - name: noncebytes
      value: 24
    - name: messagebytes_max
    - name: primitive
      type: atom
      value: xsalsa20
  functions:
    - name: crypto_stream
      c: crypto_stream
      doc: Return `CLen` bytes of keystream for the `noncebytes/0` byte nonce `N` and the `keybytes/0` byte key `K`.
      args:
        - {type: uint, name: clen, c_type: size_t, work: true}
        - {type: fixed, name: n, size: crypto_stream_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_stream_KEYBYTES}
      outputs:
        - {name: c, size: clen}
      check: none
      returns: c
      erlang:
        - params: [CLen, N, K]
    - name: xor
      doc: |
        Encrypt or decrypt `M` by combining it with the keystream for the nonce
        `N` and key `K`.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_stream_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_stream_KEYBYTES}
      outputs:
        - {name: c, size: mlen}
      check: none
      returns: c
    - name: keygen
      doc: Generate a random `keybytes/0` byte key.
      outputs:
        - {name: k, size: crypto_stream_KEYBYTES}
      rc_type: void
      check: none
      returns: k
  tests:
    - name: xor_round_trip
      code: |
        K = libsodium_crypto_stream:keygen(),
        N = libsodium_randombytes:buf(libsodium_crypto_stream:noncebytes()),
        M = libsodium_randombytes:buf(200),
        Stream = libsodium_crypto_stream:crypto_stream(264, N, K),
        264 = byte_size(Stream),
        C = libsodium_crypto_stream:'xor'(M, N, K),
        C = crypto:exor(M, binary:part(Stream, 0, 200)),
        M = libsodium_crypto_stream:'xor'(C, N, K),
        <<>> = libsodium_crypto_stream:crypto_stream(0, N, K),
        <<>> = libsodium_crypto_stream:'xor'(<<>>, N, K).
    - name: known_answer
      code: |
        K = <<16#1b27556473e985d462cd51197a9a46c76009549eac6474f206c4ee0844f68389:256>>,
        N = <<16#69696ee955b62b73cd62bda875fc73d68219e0036b7a0b37:192>>,
        <<16#662b9d0e3463029156069b12f918691a98f7dfb2ca0393c96bbfc6b1fbd630a2:256>> =
            crypto:hash(sha256, libsodium_crypto_stream:crypto_stream(4194304, N, K)).
    - name: cross_check
      code: |
        K = libsodium_crypto_stream:keygen(),
        N = libsodium_randombytes:buf(libsodium_crypto_stream:noncebytes()),
        M = libsodium_randombytes:buf(100),
        C = libsodium_crypto_stream_xsalsa20:'xor'(M, N, K),
        C = libsodium_crypto_stream:'xor'(M, N, K),
        S = libsodium_crypto_stream_xsalsa20:crypto_stream_xsalsa20(64, N, K),
        S = libsodium_crypto_stream:crypto_stream(64, N, K).
    - name: badarg
      code: |
        K = libsodium_crypto_stream:keygen(),
        N = libsodium_randombytes:buf(libsodium_crypto_stream:noncebytes()),
        ok = try libsodium_crypto_stream:'xor'(<<"m">>, <<0:16>>, K) of _ -> unexpected catch error:badarg -> ok end,
        ok = try libsodium_crypto_stream:'xor'(<<"m">>, N, <<0:16>>) of _ -> unexpected catch error:badarg -> ok end,
        ok = try libsodium_crypto_stream:crypto_stream(-1, N, K) of _ -> unexpected catch error:badarg -> ok end.
