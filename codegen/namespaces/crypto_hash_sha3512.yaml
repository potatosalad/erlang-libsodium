# yaml-language-server: $schema=../namespace.schema.json
crypto_hash_sha3512:
  title: SHA3-512
  doc: |
    SHA3-512 (FIPS 202), producing `bytes/0` byte digests, either in one shot
    or incrementally.

    The streaming functions thread an opaque `t:state/0` through `init/0`,
    `update/2`, and `final/1`; each call returns a new state and leaves its
    argument unchanged. Updates over large inputs yield to other processes
    between chunks.

    Unlike SHA-2, SHA-3 is not vulnerable to length extension attacks. Use it
    when SHA-3 is required for interoperability; otherwise
    `m:libsodium_crypto_generichash` is faster.
  example: |
    Digest = libsodium_crypto_hash_sha3512:crypto_hash_sha3512(<<"hello world">>),
    64 = byte_size(Digest),
    State0 = libsodium_crypto_hash_sha3512:init(),
    State1 = libsodium_crypto_hash_sha3512:update(State0, <<"hello ">>),
    State2 = libsodium_crypto_hash_sha3512:update(State1, <<"world">>),
    Digest = libsodium_crypto_hash_sha3512:final(State2).
  see_also: [libsodium_crypto_hash_sha3256, libsodium_crypto_hash_sha512, libsodium_crypto_generichash]
  constants:
    - name: bytes
      value: 64
    - name: statebytes
      value: 256
  functions:
    - name: crypto_hash_sha3512
      c: crypto_hash_sha3512
      doc: Hash `In`, returning a `bytes/0` byte digest.
      args:
        - {type: binary, name: in}
      outputs:
        - {name: out, size: crypto_hash_sha3512_BYTES}
      returns: out
    - name: init
      doc: Start a streaming hash, returning its state.
      outputs:
        - {type: state, name: state, c_type: crypto_hash_sha3512_state}
      returns: state
    - name: update
      doc: Absorb `In` into `State` and return the updated state.
      args:
        - {type: state, name: state, c_type: crypto_hash_sha3512_state}
        - {type: binary, name: in}
      update: true
      returns: state
    - name: final
      doc: Finish the streaming hash in `State`, returning a `bytes/0` byte digest.
      args:
        - {type: state, name: state, c_type: crypto_hash_sha3512_state}
      outputs:
        - {name: out, size: crypto_hash_sha3512_BYTES}
      call: crypto_hash_sha3512_final(&state, out)
      returns: out
  tests:
    - name: known_answer
      code: |
        In = <<"The quick brown fox jumps over the lazy dog">>,
        Expected = crypto:hash(sha3_512, In),
        Expected = libsodium_crypto_hash_sha3512:crypto_hash_sha3512(In),
        EmptyExpected = binary:decode_hex(<<"a69f73cca23a9ac5c8b567dc185a756e97c982164fe25859e0d1dcc1475c80a615b2123af1f5f94c11e3e9402c3ac558f500199d95b6d3e301758586281dcd26">>),
        EmptyExpected = crypto:hash(sha3_512, <<>>),
        EmptyExpected = libsodium_crypto_hash_sha3512:crypto_hash_sha3512(<<>>),
        EmptyExpected = libsodium_crypto_hash_sha3512:final(libsodium_crypto_hash_sha3512:init()).
    - name: streaming_matches_one_shot
      code: |
        Large = binary:copy(<<"0123456789abcdef">>, 20000),
        Expected = crypto:hash(sha3_512, <<Large/binary, "x", Large/binary>>),
        Expected = libsodium_crypto_hash_sha3512:crypto_hash_sha3512(<<Large/binary, "x", Large/binary>>),
        State0 = libsodium_crypto_hash_sha3512:init(),
        true = is_reference(State0),
        State1 = libsodium_crypto_hash_sha3512:update(State0, Large),
        State2 = libsodium_crypto_hash_sha3512:update(State1, <<"x">>),
        State3 = libsodium_crypto_hash_sha3512:update(State2, Large),
        Expected = libsodium_crypto_hash_sha3512:final(State3),
        Expected = libsodium_crypto_hash_sha3512:final(State3).
    - name: badarg
      code: |
        badarg = try libsodium_crypto_hash_sha3512:update(<<0:8>>, <<"x">>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_hash_sha3512:update(libsodium_crypto_hash_sha3512:init(), not_a_binary) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_hash_sha3512:final(<<>>) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_hash_sha3512:crypto_hash_sha3512(not_a_binary) catch error:badarg -> badarg end.
