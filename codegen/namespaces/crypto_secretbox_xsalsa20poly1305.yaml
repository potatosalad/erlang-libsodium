# yaml-language-server: $schema=../namespace.schema.json
crypto_secretbox_xsalsa20poly1305:
  title: XSalsa20-Poly1305 secret box
  doc: |
    The NaCl XSalsa20-Poly1305 secret box primitive behind
    `m:libsodium_crypto_secretbox`.

    Only the NaCl padded interface is available here: the plaintext passed to
    `crypto_secretbox_xsalsa20poly1305/3` must start with `zerobytes/0` zero
    bytes, and the ciphertext starts with `boxzerobytes/0` zero bytes
    followed by the `macbytes/0` byte tag. Keys are `keybytes/0` bytes and
    nonces `noncebytes/0` bytes; a nonce must never be reused with the same
    key. Prefer `libsodium_crypto_secretbox:easy/3` in new code.
  example: |
    Key = libsodium_crypto_secretbox_xsalsa20poly1305:keygen(),
    Nonce = libsodium_randombytes:buf(libsodium_crypto_secretbox_xsalsa20poly1305:noncebytes()),
    Padded = <<0:256, "message">>,
    Boxed = libsodium_crypto_secretbox_xsalsa20poly1305:crypto_secretbox_xsalsa20poly1305(Padded, Nonce, Key),
    <<0:128, _Tag:16/binary, _Ciphertext:7/binary>> = Boxed,
    Padded = libsodium_crypto_secretbox_xsalsa20poly1305:open(Boxed, Nonce, Key).
  constants:
    - name: keybytes
      value: 32
    - name: noncebytes
      value: 24
    - name: macbytes
      value: 16
    - name: messagebytes_max
    - name: zerobytes
      value: 32
    - name: boxzerobytes
      value: 16
  functions:
    - name: crypto_secretbox_xsalsa20poly1305
      c: crypto_secretbox_xsalsa20poly1305
      doc: |
        Encrypt `M`, which must start with `zerobytes/0` zero bytes, with the
        `noncebytes/0` byte nonce `N` and the `keybytes/0` byte key `K`.

        Returns a ciphertext of the same length as `M` that starts with
        `boxzerobytes/0` zero bytes, followed by the authentication tag and
        the encrypted message, or `-1` when `M` is shorter than
        `zerobytes/0`. Non-zero padding bytes leak the authentication key.
      args:
        - {type: binary, name: m}
        - {type: fixed, name: n, size: crypto_secretbox_xsalsa20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_xsalsa20poly1305_KEYBYTES}
      outputs:
        - {name: c, size: mlen}
      returns: c
    - name: open
      doc: |
        Verify and decrypt `C`, which must start with `boxzerobytes/0` zero
        bytes, with the nonce `N` and key `K`.

        Returns a plaintext of the same length as `C` that starts with
        `zerobytes/0` zero bytes, or `-1` when verification fails or `C` is
        shorter than `zerobytes/0`.
      args:
        - {type: binary, name: c}
        - {type: fixed, name: n, size: crypto_secretbox_xsalsa20poly1305_NONCEBYTES}
        - {type: fixed, name: k, size: crypto_secretbox_xsalsa20poly1305_KEYBYTES}
      outputs:
        - {name: m, size: clen}
      returns: m
    - name: keygen
      doc: Generate a random `keybytes/0` byte key.
      outputs:
        - {name: k, size: crypto_secretbox_xsalsa20poly1305_KEYBYTES}
      rc_type: void
      check: none
      returns: k
  tests:
    - name: round_trip
      code: |
        K = libsodium_crypto_secretbox_xsalsa20poly1305:keygen(),
        32 = byte_size(K),
        N = libsodium_randombytes:buf(24),
        M = libsodium_randombytes:buf(1000),
        Padded = <<0:256, M/binary>>,
        Boxed = libsodium_crypto_secretbox_xsalsa20poly1305:crypto_secretbox_xsalsa20poly1305(Padded, N, K),
        1032 = byte_size(Boxed),
        <<0:128, _/binary>> = Boxed,
        Padded = libsodium_crypto_secretbox_xsalsa20poly1305:open(Boxed, N, K),
        Empty = <<0:256>>,
        Empty = libsodium_crypto_secretbox_xsalsa20poly1305:open(libsodium_crypto_secretbox_xsalsa20poly1305:crypto_secretbox_xsalsa20poly1305(Empty, N, K), N, K).
    - name: tamper_and_badarg
      code: |
        K = libsodium_crypto_secretbox_xsalsa20poly1305:keygen(),
        N = libsodium_randombytes:buf(24),
        <<Z:16/binary, B, Rest/binary>> = libsodium_crypto_secretbox_xsalsa20poly1305:crypto_secretbox_xsalsa20poly1305(<<0:256, "message">>, N, K),
        -1 = libsodium_crypto_secretbox_xsalsa20poly1305:open(<<Z/binary, (B bxor 1), Rest/binary>>, N, K),
        -1 = libsodium_crypto_secretbox_xsalsa20poly1305:open(<<0:248>>, N, K),
        -1 = libsodium_crypto_secretbox_xsalsa20poly1305:crypto_secretbox_xsalsa20poly1305(<<0:248>>, N, K),
        badarg = try libsodium_crypto_secretbox_xsalsa20poly1305:open(<<0:256>>, <<0:64>>, K) catch error:badarg -> badarg end,
        badarg = try libsodium_crypto_secretbox_xsalsa20poly1305:crypto_secretbox_xsalsa20poly1305(<<0:256>>, N, <<0:8>>) catch error:badarg -> badarg end.
