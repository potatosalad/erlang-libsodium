[project]
name = "erlang-libsodium-codegen"
version = "0.1.0"
description = "Generate C and Erlang code from YAML configuration using Jinja2."
authors = [
    {name = "Andrew Bennett", email = "potatosaladx@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click (>=8.5.0,<9.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)"
]

[project.scripts]
erlang_libsodium_codegen = "erlang_libsodium_codegen.__main__:main"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 132
target-version = ["py313"]

[tool.poetry]
packages = [{include = "erlang_libsodium_codegen", from = "src"}]

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
clang-format = "^23.1.3"
pytest = "^9.1.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
